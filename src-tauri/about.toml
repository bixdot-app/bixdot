# Mirrors docs/governance/03_GOVERNANCE.md section 4 — used to generate
# THIRD_PARTY_LICENSES.txt (release.yml), not the licence gate itself
# (that's src-tauri/deny.toml, cargo-deny). Kept in sync manually since these
# two tools have separate config formats.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "HPND",
    "MIT-CMU",
    "Unlicense",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BUSL-1.1",
]

# bixdot is this workspace's own crate — not a third-party dependency.
ignore-build-dependencies = false
ignore-dev-dependencies = true
