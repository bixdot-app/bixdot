[package]
name = "bixdot"
version = "0.3.2"
description = "BixDot — Local-first AI Agent. No cloud required."
authors = ["DigiTech Business Pte. Ltd."]
license = "BUSL-1.1"
repository = "https://github.com/bixdot-app/bixdot"
edition = "2021"
rust-version = "1.77"

# No [lib] section — single binary, avoids #[tauri::command] macro_export conflicts

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
