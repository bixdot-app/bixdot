[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bixdot"
version = "0.1.0"
description = "The AI agent platform built after reading all 433 BixDot CVEs."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "DigiTech Business Pte. Ltd", email = "hello@bixdot.app" }
]
keywords = ["ai-agent", "security", "local-first", "zero-trust", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.1",
    "keyring>=25.4.1",
    "anthropic>=0.34.2",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "bandit>=1.7.10",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
]

[project.urls]
Homepage = "https://bixdot.app"
Repository = "https://github.com/bixdot/bixdot"
"Bug Tracker" = "https://github.com/bixdot/bixdot/issues"
Security = "https://github.com/bixdot/bixdot/security/policy"

[project.scripts]
bixdot = "core.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
