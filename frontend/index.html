          '. Re-verified on every startup and every time you open this page.')
      )
    ),
    // Headline numbers
    el('div',{className:'bigstat'},
      el('div',null,
        el('div',{className:'n',style:{color:'var(--accent)'}},(rep.totals.cloud||0).toString()),
        el('div',{className:'l'},'connections to cloud AI')),
      el('div',null,
        el('div',{className:'n'},(rep.totals.local||0).toLocaleString()),
        el('div',{className:'l'},'local AI calls (this device)')),
      el('div',null,
        el('div',{className:'n',style:{color:'var(--blue)'}},(rep.totals.optin||0).toLocaleString()),
        el('div',{className:'l'},'opt-in connections'))
    ),
    // Connection ledger — full disclosure incl. zero rows
    el('div',{className:'s-label',style:{marginBottom:7}},'Every place BixDot talks — and why'),
    el('table',{className:'ledger'},
      el('thead',null,el('tr',null,
        el('th',null,'Purpose'),el('th',null,'Where'),el('th',null,'Type'),
        el('th',{style:{textAlign:'right'}},'Calls'),el('th',null,'Last')
      )),
      el('tbody',null,
        rep.counters.map(c=>el('tr',{key:c.kind},
          el('td',null,c.label),
          el('td',{style:{color:'var(--muted)',fontSize:11}},c.where),
          el('td',null,catPill(c.category)),
          el('td',{style:{textAlign:'right',fontFamily:'var(--mono)'}},c.count.toLocaleString()),
          el('td',{style:{color:'var(--muted)',fontSize:11}},fmtLast(c.last_at))
        ))
      )
    ),
    // Structural facts
    el('div',{className:'priv-facts'},
      el('div',{className:'priv-fact'},'🔒',el('span',null,'Server bound to ',
        el('code',{style:{color:'var(--accent)',fontFamily:'var(--mono)'}},rep.config.bind_host+':'+rep.config.bind_port),
        ' — unreachable from your network or the internet.')),
      el('div',{className:'priv-fact'},rep.config.cloud_llm_enabled?'⚠️':'✅',
        el('span',null,'Cloud AI is ',el('b',null,rep.config.cloud_llm_enabled?'ENABLED':'off'),
          rep.config.cloud_llm_enabled?' — you turned this on; PII is scrubbed before anything is sent.':' — your conversations never leave this computer.')),
      el('div',{className:'priv-fact'},rep.config.telegram_enabled?'📱':'✅',
        el('span',null,'Telegram bridge is ',el('b',null,rep.config.telegram_enabled?'on':'off'),
          rep.config.telegram_enabled?' — messages you send from your phone pass through Telegram.':'.')),
      el('div',{className:'priv-fact'},'🔑',el('span',null,(rep.grants_active||0)+' active permission grant(s) — revoke any time in Settings.'))
    ),
    // Honesty box
    el('div',{style:{fontSize:11.5,color:'var(--muted)',lineHeight:1.6,background:'var(--card)',border:'1px solid var(--border)',borderRadius:9,padding:'10px 12px'}},
      el('b',{style:{color:'var(--text)'}},'How this is measured: '),
      'BixDot counts every outbound connection its own code makes, at every network call site, and the audit log records each action in a tamper-evident chain. This is BixDot’s own accounting — not an operating-system firewall. The structural guarantees are what make it strong: the server only listens on this computer, cloud AI is off unless you turn it on, and the desktop app additionally checks GitHub once at launch for signed updates.')
  );
}

  const applyWTemplate=(t)=>{
    setShowWForm(true); setWName(t.name); setWType(t.type); setWPrompt(t.prompt);
    setWCaps(t.caps.slice());
    if(t.lead) setWLead(t.lead);
  };
  const toggleWCap=(c)=>setWCaps(cs=>cs.includes(c)?cs.filter(x=>x!==c):[...cs,c]);

  const createWatcher=async()=>{
    if(!wName.trim()||!wPrompt.trim()){ setMsg('Give your watcher a name and tell it what to do.'); return; }
    setWCreating(true); setMsg('');
    try{
      const config=wType==='folder_new_file'?{folder:wFolder,pattern:wPattern||'*'}:{lead_minutes:wLead};
      await api('/agent/watchers',{method:'POST',body:JSON.stringify({
        name:wName,type:wType,prompt:wPrompt,config,
        notify_desktop:true,notify_telegram:wTg,capabilities:wCaps,

  const toggleWatcher=async(x)=>{ await api('/agent/watchers/'+x.watcher_id,{method:'PUT',body:JSON.stringify({is_enabled:!x.is_enabled})},token).catch(()=>{}); load(); };

        el('input',{className:'form-input',value:fName,onChange:e=>setFName(e.target.value),placeholder:'Morning Briefing'})),

      el('div',{style:{fontSize:12,color:'var(--muted)',marginBottom:6}},x.prompt.slice(0,140)+(x.prompt.length>140?'…':'')),
      el('div',{style:{display:'flex',flexWrap:'wrap',gap:4}},
        (x.capabilities||[]).map(c=>el('span',{key:c,className:'skill-cap',title:capInfo(c).desc},capInfo(c).icon+' '+capInfo(c).title))
      )
    ))
  );
}

// ── Terminal ──────────────────────────────────────────────────────────────────
function Terminal({token}){
  const[lines,setLines]=useState([{type:'sys',text:'BixDot Terminal — sandboxed, allowlisted commands only.'},
    {type:'sys',text:'Type a command and press Enter. Try: python --version  |  git --version  |  ollama list'}]);
  const[input,setInput]=useState('');
  const[cwd,setCwd]=useState('~');
  const[running,setRunning]=useState(false);
  const[history,setHistory]=useState([]);
  const[histIdx,setHistIdx]=useState(-1);
  const bottom=useRef(null);
  const inp=useRef(null);

  useEffect(()=>{ bottom.current?.scrollIntoView({behavior:'smooth'}); },[lines]);

  const addLine=(type,text)=>setLines(l=>[...l,{type,text}]);

  const run=async()=>{
    const cmd=input.trim();
    if(!cmd||running) return;
    setHistory(h=>[cmd,...h.slice(0,49)]);
    setHistIdx(-1);
    setInput('');
    addLine('prompt','$ '+cmd);
    setRunning(true);
    try{
      const r=await api('/terminal/run',{method:'POST',body:JSON.stringify({command:cmd,cwd:cwd==='~'?null:cwd})},token);
      if(r.blocked){
        addLine('blocked','⛔ '+r.blocked);
      } else {
        if(r.stdout) addLine('out',r.stdout);
        if(r.stderr) addLine('err',r.stderr);
        if(!r.stdout&&!r.stderr) addLine('out','(exit '+r.exit_code+')');
        if(r.exit_code!==0&&!r.stderr) addLine('err','Exit code: '+r.exit_code);
      }
    }catch(e){
      addLine('err','Error: '+e.message);
    }
    setRunning(false);
    setTimeout(()=>inp.current?.focus(),50);
  };

  const onKey=e=>{
    if(e.key==='Enter'){ e.preventDefault(); run(); }
    else if(e.key==='ArrowUp'){
      e.preventDefault();
      const idx=Math.min(histIdx+1,history.length-1);
      setHistIdx(idx);
      if(history[idx]) setInput(history[idx]);
    }
    else if(e.key==='ArrowDown'){
      e.preventDefault();
      const idx=Math.max(histIdx-1,-1);
      setHistIdx(idx);
      setInput(idx===-1?'':history[idx]||'');
    }
    else if(e.key==='l'&&e.ctrlKey){
      e.preventDefault();
      setLines([{type:'sys',text:'[cleared]'}]);
    }
  };

  const lineColor={prompt:'var(--accent)',out:'var(--text)',err:'var(--warn)',blocked:'var(--red)',sys:'var(--muted)'};

  return el('div',{className:'term-body'},
    el('div',{className:'term-warn-bar'},'⚠ Commands run on your device. Only allowlisted tools permitted. Ctrl+L to clear.'),
    el('div',{className:'term-output',onClick:()=>inp.current?.focus()},
      lines.map((l,i)=>el('div',{key:i,className:'term-line',style:{color:lineColor[l.type]||'var(--text)'}},l.text)),
      running&&el('div',{className:'term-line',style:{color:'var(--muted)'}},'Running…'),
      el('div',{ref:bottom})
    ),
    el('div',{className:'term-input-row'},
      el('span',{className:'term-ps'},'$'),
      el('input',{
        ref:inp,
        className:'term-input',
        value:input,
        onChange:e=>setInput(e.target.value),
        onKeyDown:onKey,
        placeholder:'enter command…',
        disabled:running,
        autoFocus:true,
        spellCheck:false,
        autoComplete:'off',
        autoCorrect:'off',
      }),
      el('button',{className:'term-run',onClick:run,disabled:running||!input.trim()},running?'…':'Run')
    )
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[token,setToken]=useState(_tok);
  const[username,setUsername]=useState(_usr);
  const[screen,setScreen]=useState('chat');
  const[activeModel,setActiveModel]=useState('llama3.2');
  const[showOnboarding,setShowOnboarding]=useState(false);
  const[licenseBanner,setLicenseBanner]=useState(null); // null = no banner
  const[toasts,setToasts]=useState([]);

  // In-app notifications: poll the queue (routines etc.) and show toasts.
  useEffect(()=>{
    if(!token) return;
    const poll=()=>api('/agent/notifications/pending',{},token).then(r=>{
      const items=(r&&r.notifications)||[];
      if(items.length){
        setToasts(t=>[...t,...items]);
        items.forEach(n=>setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==n.id)),9000));
      }
    }).catch(()=>{});
    poll();
    const iv=setInterval(poll,20000);
    return()=>clearInterval(iv);
  },[token]);

  const login=(t,u,licenseRequired,licenseMessage)=>{
    setToken(t); setUsername(u);
    // Fetch persisted model on login
    api('/agent/model',{},t).then(r=>setActiveModel(r.model)).catch(()=>{});
    // Check if Ollama is ready; show wizard if not
    fetch('http://localhost:8747/health/onboarding')
      .then(r=>r.json())
      .then(s=>{ if(!s.ready) setShowOnboarding(true); })
      .catch(()=>setShowOnboarding(true));
    // Show license banner for commercial users — non-blocking
    if(licenseRequired&&licenseMessage) setLicenseBanner(licenseMessage);
    else{
      // Re-check via API (handles returning users whose email was set earlier)
      api('/auth/license-status',{},t)
        .then(r=>{ if(r.license_required&&r.message) setLicenseBanner(r.message); })
        .catch(()=>{});
    }
  };
  const logout=()=>{ clearToken(); setToken(null); setUsername(''); setShowOnboarding(false); setLicenseBanner(null); };

  if(!token) return el(Login,{onLogin:login});

  const nav=[
    {id:'chat',label:'Chat',icon:CHAT_ICON},
    {id:'routines',label:'Routines',icon:ROUTINE_ICON},
    {id:'privacy',label:'Privacy',icon:SHIELD_ICON},
    {id:'calendar',label:'Calendar',icon:CAL_ICON},
    {id:'terminal',label:'Terminal',icon:TERM_ICON},
    {id:'audit',label:'Audit log',icon:AUDIT_ICON},
    {id:'settings',label:'Settings',icon:SETTINGS_ICON},
  ];

  return el('div',{className:'app'},
    el('div',{className:'sidebar'},
      el('div',{className:'sb-head'},
        el('div',{className:'logo'},el('div',{className:'logo-dot'}),el('span',{className:'logo-name'},'BixDot')),
        el('span',{className:'badge'},'LOCAL · OFFLINE')
      ),
      el('nav',{className:'nav'},
        nav.map(n=>el('div',{key:n.id,className:'nav-item'+(screen===n.id?' active':''),onClick:()=>setScreen(n.id)},
          el(SVG,{d:n.icon}),el('span',null,n.label)
        ))
      ),
      el('div',{className:'sb-foot'},
        el('div',{className:'model-pill'},el('div',{className:'model-dot'}),el('span',{style:{fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)'}},activeModel+' · local')),
        el('button',{className:'signout',onClick:logout},'Sign out ('+username+')')
      )
    ),
    el('div',{className:'main'},
      licenseBanner&&el('div',{id:'license-banner'},
        el('span',null,'⚠ ',el('strong',null,'Commercial use detected.'),' BixDot is free for personal use. Commercial use requires a license.'),
        el('div',{style:{display:'flex',gap:12,alignItems:'center'}},
          el('a',{href:'mailto:legal@bixdot.app'},'Get a license →'),
          el('button',{onClick:()=>{
            setLicenseBanner(null);
            api('/auth/dismiss-license-banner',{method:'POST'},token).catch(()=>{});
          },title:'Dismiss permanently'},'✕')
        )
      ),
      el('div',{className:'topbar'},
        el('span',{className:'topbar-title'},nav.find(n=>n.id===screen)?.label),
        el('span',{className:'chain-ok'},'✓ Chain verified · Local')
      ),
      screen==='chat'&&el(Chat,{token,model:activeModel}),
      screen==='routines'&&el(Routines,{token}),
      screen==='privacy'&&el(Privacy,{token}),
      screen==='calendar'&&el(Calendar,{token}),
      screen==='terminal'&&el(Terminal,{token}),
      screen==='audit'&&el(Audit,{token}),
      screen==='settings'&&el(Settings,{token,onModelChange:m=>setActiveModel(m)}),
      showOnboarding&&el(OnboardingWizard,{onDismiss:()=>setShowOnboarding(false),token})
    ),
    toasts.length>0&&el('div',{className:'toasts'},
      toasts.map(n=>el('div',{key:n.id,className:'toast',onClick:()=>setToasts(t=>t.filter(x=>x.id!==n.id))},
        el('div',{className:'toast-title'},'⏰ '+n.title),
        el('div',{className:'toast-body'},n.body)
      ))
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(el(App));
</script>
</body>
</html>
