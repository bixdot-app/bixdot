<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BixDot</title>
<style>
  :root {
    --bg:#080c10;--surface:#0f1520;--card:#141d2a;--border:#1e2d40;
    --accent:#00d4aa;--accent-dim:rgba(0,212,170,.10);--accent-mid:rgba(0,212,170,.25);
    --warn:#f5a623;--warn-dim:rgba(245,166,35,.12);
    --red:#ff4757;--red-dim:rgba(255,71,87,.12);
    --blue:#3d91ff;
    --text:#e2eaf5;--muted:#4a6080;--subtle:#1e2d40;
    --mono:'JetBrains Mono','Fira Code',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden;}
  .app{display:flex;height:100vh;}
  /* Sidebar */
  .sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
  .sb-head{padding:14px;border-bottom:1px solid var(--border);}
  .logo{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .logo-name{font-size:15px;font-weight:600;}
  .badge{display:inline-flex;align-items:center;background:var(--accent-dim);border:1px solid var(--accent-mid);border-radius:20px;padding:3px 8px;font-size:10px;color:var(--accent);font-family:var(--mono);}
  .nav{padding:8px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);margin-bottom:2px;transition:all .15s;}
  .nav-item:hover{background:var(--card);color:var(--text);}
  .nav-item.active{background:var(--accent-dim);color:var(--accent);}
  .sb-foot{padding:10px;border-top:1px solid var(--border);}
  .model-pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:8px;}
  .model-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
  .signout{width:100%;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px;font-size:12px;cursor:pointer;}
  .signout:hover{color:var(--text);border-color:var(--text);}
  /* Main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0;}
  .topbar-title{font-size:14px;font-weight:500;}
  .chain-ok{font-size:11px;font-family:var(--mono);color:var(--accent);background:var(--accent-dim);padding:3px 8px;border-radius:6px;}
  /* Chat */
  .chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px;}
  .chat-body::-webkit-scrollbar{width:3px;}
  .chat-body::-webkit-scrollbar-thumb{background:var(--border);}
  .msg-row{display:flex;}
  .msg-row.user{justify-content:flex-end;}
  .msg{max-width:75%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;}
  .msg.user{background:var(--blue);color:#fff;border-bottom-right-radius:4px;}
  .msg.agent{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg.sys{background:var(--warn-dim);border:1px solid rgba(245,166,35,.3);border-radius:8px;max-width:90%;font-size:12px;}
  .msg.err{background:var(--red-dim);border:1px solid rgba(255,71,87,.3);border-radius:8px;max-width:90%;font-size:12px;}
  .typing{display:flex;gap:4px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px;width:fit-content;}
  .typing span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--muted);text-align:center;padding:40px;gap:10px;}
  .empty p{font-size:13px;line-height:1.6;max-width:280px;}
  .chat-input{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;}
  .chat-input input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s;}
  .chat-input input:focus{border-color:var(--accent);}
  .chat-input input::placeholder{color:var(--muted);}
  .send-btn{width:38px;height:38px;border-radius:10px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .send-btn:disabled{opacity:.35;cursor:not-allowed;}
  /* Perm modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:340px;}
  .modal-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .modal-icon{width:36px;height:36px;border-radius:9px;background:var(--warn-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
  .modal-body{padding:14px 16px;}
  .checks{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
  .check-item{display:flex;gap:7px;font-size:12px;color:var(--muted);align-items:flex-start;}
  .modal-btns{display:flex;gap:8px;padding:0 16px 14px;}
  .btn{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);transition:all .15s;}
  .btn-allow{background:var(--accent);color:#080c10;border-color:var(--accent);}
  .btn-deny{background:transparent;color:var(--muted);}
  .btn-deny:hover{background:var(--card);color:var(--text);}
  /* Audit */
  .audit-body{flex:1;overflow-y:auto;}
  .audit-row{display:flex;gap:10px;padding:9px 18px;border-bottom:1px solid var(--border);align-items:flex-start;}
  .audit-row:hover{background:var(--card);}
  .audit-time{font-size:11px;font-family:var(--mono);color:var(--muted);min-width:50px;padding-top:2px;flex-shrink:0;}
  .evt{font-size:10px;padding:2px 6px;border-radius:5px;font-family:var(--mono);display:inline-block;margin-bottom:2px;}
  .evt-g{background:var(--accent-dim);color:var(--accent);}
  .evt-b{background:rgba(61,145,255,.12);color:var(--blue);}
  .evt-w{background:var(--warn-dim);color:var(--warn);}
  .evt-n{background:var(--subtle);color:var(--muted);}
  .audit-detail{font-size:12px;color:var(--text);font-family:var(--mono);}
  /* Settings */
  .settings-body{flex:1;overflow-y:auto;padding:18px;max-width:520px;}
  .s-section{margin-bottom:22px;}
  .s-label{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;font-family:var(--mono);}
  .s-card{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden;}
  .s-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
  .s-row:last-child{border-bottom:none;}
  .s-info p{font-size:13px;font-weight:500;margin:0 0 2px;}
  .s-info span{font-size:11px;color:var(--muted);}
  .toggle{width:36px;height:20px;border-radius:10px;background:var(--border);cursor:pointer;position:relative;border:none;flex-shrink:0;}
  .toggle.on{background:var(--accent);}
  .toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;}
  .toggle.on::after{left:19px;}
  .s-active{font-size:11px;background:var(--accent-dim);color:var(--accent);padding:3px 8px;border-radius:6px;font-family:var(--mono);}
  .revoke-btn{background:transparent;border:1px solid var(--border);color:var(--red);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;}
  /* Login */
  .login-page{display:flex;align-items:center;justify-content:center;height:100vh;}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px;width:320px;}
  .login-logo{text-align:center;margin-bottom:22px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-family:var(--mono);}
  .field input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s;}
  .field input:focus{border-color:var(--accent);}
  .login-btn{width:100%;background:var(--accent);color:#080c10;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}
  .login-btn:disabled{opacity:.5;cursor:not-allowed;}
  .err-box{font-size:12px;color:var(--red);background:var(--red-dim);border-radius:6px;padding:8px 10px;margin-top:8px;text-align:center;}
  .note-box{font-size:12px;color:var(--accent);background:var(--accent-dim);border-radius:6px;padding:8px 10px;margin-bottom:12px;}
  /* License banner */
  #license-banner{background:var(--surface);border-bottom:1px solid var(--accent-mid);padding:9px 18px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text);flex-shrink:0;}
  #license-banner a{color:var(--accent);text-decoration:none;font-weight:500;}
  #license-banner button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px;}

  /* Calendar */
  .cal-body{flex:1;overflow-y:auto;padding:18px;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cal-title{font-size:14px;font-weight:500;}
  .cal-actions{display:flex;gap:8px;}
  .cal-btn{background:var(--accent);color:#080c10;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}
  .cal-btn-sec{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;}
  .cal-btn-sec:hover{color:var(--text);border-color:var(--text);}
  .event-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;}
  .event-date{background:var(--accent-dim);border:1px solid var(--accent-mid);border-radius:8px;padding:6px 10px;text-align:center;min-width:48px;flex-shrink:0;}
  .event-day{font-size:18px;font-weight:700;color:var(--accent);line-height:1;}
  .event-mon{font-size:10px;color:var(--accent);font-family:var(--mono);text-transform:uppercase;}
  .event-info{flex:1;}
  .event-title{font-size:13px;font-weight:500;margin-bottom:3px;}
  .event-meta{font-size:11px;color:var(--muted);}
  .no-cal{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:var(--muted);text-align:center;gap:10px;}
  .no-cal p{font-size:13px;max-width:260px;line-height:1.6;}
  /* Create event modal */
  .create-form{display:flex;flex-direction:column;gap:10px;padding:14px 16px;}
  .form-field{display:flex;flex-direction:column;gap:4px;}
  .form-label{font-size:11px;color:var(--muted);font-family:var(--mono);}
  .form-input{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--text);outline:none;}
  .form-input:focus{border-color:var(--accent);}
  /* Settings cal section */
  .provider-card{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
  .provider-card:last-child{border-bottom:none;}
  .provider-info p{font-size:13px;font-weight:500;margin:0 0 2px;}
  .provider-info span{font-size:11px;color:var(--muted);}
  .connect-btn{background:var(--accent);color:#080c10;border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .connected-badge{font-size:11px;background:var(--accent-dim);color:var(--accent);padding:3px 8px;border-radius:6px;font-family:var(--mono);}
  .setup-form{padding:10px 14px;background:var(--subtle);border-top:1px solid var(--border);}
  .setup-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--text);outline:none;margin-bottom:6px;font-family:var(--mono);}
  .setup-input:focus{border-color:var(--accent);}

  /* Terminal */
  .term-body{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .term-output{flex:1;overflow-y:auto;padding:14px 18px;font-family:var(--mono);font-size:12px;line-height:1.7;}
  .term-output::-webkit-scrollbar{width:3px;}
  .term-output::-webkit-scrollbar-thumb{background:var(--border);}
  .term-line{margin-bottom:2px;white-space:pre-wrap;word-break:break-all;}
  .term-prompt{color:var(--accent);}
  .term-out{color:var(--text);}
  .term-err{color:var(--warn);}
  .term-blocked{color:var(--red);}
  .term-input-row{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--border);background:var(--surface);}
  .term-ps{color:var(--accent);font-family:var(--mono);font-size:12px;white-space:nowrap;}
  .term-input{flex:1;background:transparent;border:none;outline:none;font-family:var(--mono);font-size:12px;color:var(--text);}
  .term-run{background:var(--accent);color:#080c10;border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--mono);}
  .term-run:disabled{opacity:.35;cursor:not-allowed;}
  .term-warn-bar{background:var(--warn-dim);border-bottom:1px solid rgba(245,166,35,.3);padding:7px 18px;font-size:11px;color:var(--warn);font-family:var(--mono);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

  /* Session rail (inside Chat) */
  .chat-wrap{display:flex;flex:1;overflow:hidden;}
  .srail{width:240px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);}
  .srail-head{padding:10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--border);}
  .srail-btn{display:flex;align-items:center;gap:7px;width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;transition:all .15s;}
  .srail-btn:hover{border-color:var(--accent);color:var(--accent);}
  .srail-btn.priv{border-color:rgba(245,166,35,.4);color:var(--warn);}
  .srail-btn.priv:hover{background:var(--warn-dim);}
  .srail-list{flex:1;overflow-y:auto;padding:6px;}
  .srail-list::-webkit-scrollbar{width:3px;}
  .srail-list::-webkit-scrollbar-thumb{background:var(--border);}
  .sitem{display:flex;flex-direction:column;gap:3px;padding:8px 9px;border-radius:8px;cursor:pointer;margin-bottom:2px;position:relative;}
  .sitem:hover{background:var(--card);}
  .sitem.active{background:var(--accent-dim);}
  .sitem-top{display:flex;align-items:center;gap:6px;}
  .sitem-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .sitem.priv .sitem-name{font-style:italic;color:var(--warn);}
  .sitem-prev{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sitem-menu{position:absolute;top:6px;right:6px;color:var(--muted);font-size:14px;padding:0 4px;border:none;background:none;cursor:pointer;opacity:0;line-height:1;}
  .sitem:hover .sitem-menu{opacity:1;}
  .sitem-rename{font-size:12px;background:var(--bg);border:1px solid var(--accent);border-radius:5px;padding:3px 6px;color:var(--text);outline:none;width:100%;}
  .smenu{position:absolute;top:24px;right:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;z-index:20;min-width:120px;box-shadow:0 6px 20px rgba(0,0,0,.4);overflow:hidden;}
  .smenu button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:12px;background:none;border:none;color:var(--text);cursor:pointer;}
  .smenu button:hover{background:var(--surface);}
  .smenu button.danger{color:var(--red);}
  .srail-arch{border-top:1px solid var(--border);padding:8px;}
  .srail-arch-h{font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px;}
  .mode-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-family:var(--mono);padding:1px 5px;border-radius:4px;background:var(--card);border:1px solid var(--border);flex-shrink:0;}
  .chat-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .chat-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--border);gap:10px;}
  .chat-header-name{font-size:13px;font-weight:500;cursor:pointer;}
  .chat-header-name:hover{color:var(--accent);}
  .priv-banner{background:var(--warn-dim);border-top:1px solid rgba(245,166,35,.3);color:var(--warn);font-size:11px;padding:7px 16px;display:flex;align-items:center;gap:8px;}
  /* Model picker groups */
  .mp-group{margin-bottom:10px;}
  .mp-ghead{font-size:11px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .mp-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:4px;cursor:pointer;font-size:12px;background:var(--card);}
  .mp-item:hover{border-color:var(--accent);}
  .mp-item.sel{border-color:var(--accent);background:var(--accent-dim);}
  .mp-item.disabled{opacity:.6;cursor:not-allowed;}
  .mp-warn{background:var(--warn-dim);border:1px solid rgba(245,166,35,.3);color:var(--warn);font-size:11px;border-radius:7px;padding:8px 10px;margin-bottom:8px;line-height:1.5;}
  /* Skill cards */
  .skill-cap{font-size:10px;font-family:var(--mono);background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--blue);}

  /* v0.5 — Persona chips */
  .pchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .pchip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:18px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text);transition:all .15s;}
  .pchip:hover{border-color:var(--accent);}
  .pchip.sel{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
  /* v0.5 — Toasts (in-app notifications) */
  .toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px;}
  .toast{background:var(--surface);border:1px solid var(--accent-mid);border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:slidein .25s ease;}
  .toast-title{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px;}
  .toast-body{font-size:12px;color:var(--muted);line-height:1.5;max-height:80px;overflow:hidden;}
  @keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
  /* v0.5 — Routines */
  .routines-body{flex:1;overflow-y:auto;padding:18px;max-width:620px;}
  .routine-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:10px;}
  .routine-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .routine-name{font-size:14px;font-weight:600;}
  .routine-meta{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:8px;}
  .routine-actions{display:flex;gap:8px;align-items:center;}
  .tmpl-chip{border:1px dashed var(--accent-mid);background:var(--accent-dim);color:var(--accent);border-radius:9px;padding:8px 12px;font-size:12px;cursor:pointer;}
  /* v0.5 — Friendly permission rows */
  .cap-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;cursor:pointer;background:var(--card);}
  .cap-row.sel{border-color:var(--accent);background:var(--accent-dim);}
  .cap-ic{font-size:17px;flex-shrink:0;}
  .cap-t{font-size:12.5px;font-weight:500;}
  .cap-d{font-size:11px;color:var(--muted);}
  /* v0.5 — Download progress */

// Token stored in memory — works in all browsers regardless of tracking prevention
let _tok=null, _usr='';

function getToken(){ return _tok; }
function setStoredToken(t,u){ _tok=t; _usr=u; try{sessionStorage.setItem('_bd_t',t);sessionStorage.setItem('_bd_u',u);}catch(e){} }
function clearToken(){ _tok=null; _usr=''; try{sessionStorage.clear();}catch(e){} }
// Try to restore from sessionStorage on page load
try{ const t=sessionStorage.getItem('_bd_t'); if(t){_tok=t; _usr=sessionStorage.getItem('_bd_u')||'';} }catch(e){}

async function api(path,opts={},token){
  const h={'Content-Type':'application/json'};
  if(token) h['Authorization']='Bearer '+token;
  const r=await fetch('http://localhost:8747'+path,{...opts,headers:h});
  if(!r.ok){
    let msg=r.statusText;
    try{ const e=await r.json(); msg=Array.isArray(e.detail)?e.detail.map(d=>d.msg).join(', '):(e.detail||msg); }catch(e){}
    throw new Error(msg);
  }
  return r.status===204?null:r.json();
}

// ── Login ─────────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const[u,setU]=useState('');
  const[p,setP]=useState('');
  const[email,setEmail]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const[setup,setSetup]=useState(false);

  useEffect(()=>{
    api('/auth/setup-status').then(r=>setSetup(!r.setup_complete)).catch(()=>{});
  },[]);

  const submit=async()=>{
    if(!u||!p) return;
    setLoading(true); setErr('');
    try{
      const body=setup?{username:u,password:p,email:email||undefined}:{username:u,password:p};
      const d=await api(setup?'/auth/setup':'/auth/login',{method:'POST',body:JSON.stringify(body)});
      setStoredToken(d.access_token,u);
      onLogin(d.access_token,u,d.license_required,d.license_message);
    }catch(e){ setErr(e.message); }
    setLoading(false);
  };

  return el('div',{className:'login-page'},
    el('div',{className:'login-box'},
      el('div',{className:'login-logo'},
        el('div',{className:'logo',style:{justifyContent:'center',marginBottom:6}},
          el('div',{className:'logo-dot'}),
          el('span',{className:'logo-name'},'BixDot')
        ),
        el('div',{style:{textAlign:'center'}},el('span',{className:'badge'},'LOCAL FIRST · NO CLOUD'))
      ),
      setup&&el('div',{className:'note-box'},'First run — create your owner account'),
      el('div',{className:'field'},el('label',null,'Username'),el('input',{value:u,onChange:e=>setU(e.target.value),placeholder:'username',autoFocus:true,onKeyDown:e=>e.key==='Enter'&&submit()})),
      setup&&el('div',{className:'field'},el('label',null,'Work email (optional)'),el('input',{type:'email',value:email,onChange:e=>setEmail(e.target.value),placeholder:'you@company.com',onKeyDown:e=>e.key==='Enter'&&submit()})),
      el('div',{className:'field'},el('label',null,'Password'),el('input',{type:'password',value:p,onChange:e=>setP(e.target.value),placeholder:'••••••••••••',onKeyDown:e=>e.key==='Enter'&&submit()})),
      setup&&el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:8,lineHeight:1.5}},'Password needs: 12+ chars, uppercase, lowercase, number, special char (e.g. BixDot123!hello)'),
      el('button',{className:'login-btn',onClick:submit,disabled:loading},loading?'Please wait…':setup?'Create account':'Sign in'),
      err&&el('div',{className:'err-box'},err)
    )
  );
}

// ── Onboarding Wizard ─────────────────────────────────────────────────────────
function OnboardingWizard({onDismiss,token}){
  const[status,setStatus]=useState(null);
  const[checking,setChecking]=useState(false);
  const[dl,setDl]=useState(null); // {pct,status,err,busy}

  const download=async()=>{
    const model=(status&&status.suggested_model)||'llama3.2';
    setDl({pct:0,status:'Starting download…',busy:true});
    try{
      const r=await fetch('http://localhost:8747/agent/models/pull',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({model}),
      });
      if(!r.ok||!r.body) throw new Error('Could not start the download.');
      const reader=r.body.getReader(); const dec=new TextDecoder(); let buf='';
      while(true){
        const{done,value}=await reader.read();
        if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop();
        for(const ln of lines){
          if(!ln.trim()) continue;
          try{
            const j=JSON.parse(ln);
            if(j.error){ setDl({pct:0,status:j.error,err:true}); return; }
            if(j.total&&j.completed!=null){
              setDl({pct:Math.min(100,Math.round(j.completed/j.total*100)),status:'Downloading…',busy:true});
            } else if(j.status){
              setDl(d=>({pct:(d&&d.pct)||0,status:j.status,busy:true}));
            }
          }catch(e){}
        }
      }
      setDl({pct:100,status:'Done! Starting BixDot…',busy:false});
      check();
    }catch(e){ setDl({pct:0,status:'Download failed: '+e.message,err:true}); }
  };

  const check=async()=>{
    setChecking(true);
    try{ const r=await fetch('http://localhost:8747/health/onboarding'); setStatus(await r.json()); }
    catch(e){ setStatus({ollama_running:false,models:[],has_models:false,ready:false}); }
    setChecking(false);
  };

  useEffect(()=>{ check(); const iv=setInterval(check,4000); return()=>clearInterval(iv); },[]);

  // Auto-dismiss once ready
  useEffect(()=>{ if(status&&status.ready) setTimeout(onDismiss,1200); },[status]);

  const steps=[
    {
      id:'ollama',
      label:'Ollama is running',
      done: status&&status.ollama_running,
      desc: el('span',null,
        'Download and install Ollama from ',
        el('a',{href:'https://ollama.ai',target:'_blank',rel:'noreferrer',style:{color:'var(--accent)'}},'ollama.ai'),
        ', then start it.'
      ),
    },
    {
      id:'model',
      label:'An AI model is installed',
      done: status&&status.has_models,
      desc: el('div',null,
        el('div',{style:{marginBottom:6}},'BixDot needs one AI model (~2 GB, one-time download). It runs entirely on this computer.'),
        dl&&el('div',null,
          el('div',{className:'dlbar'},el('div',{style:{width:(dl.pct||0)+'%'}})),
          el('div',{style:{fontSize:11,color:dl.err?'var(--red)':'var(--muted)'}},
            (dl.pct?dl.pct+'% · ':'')+dl.status)
        ),
        (!dl||dl.err)&&el('button',{
          className:'connect-btn',style:{marginTop:6},
          disabled:!(status&&status.ollama_running),
          onClick:download,
        },dl&&dl.err?'Try again':'⬇ Download '+(status?.suggested_model||'llama3.2')),
        !(status&&status.ollama_running)&&el('div',{style:{fontSize:11,color:'var(--muted)',marginTop:4}},'Finish step 1 first.')
      ),
    },
  ];

  const allDone=status&&status.ready;

  return el('div',{className:'modal-bg'},
    el('div',{className:'modal',style:{maxWidth:400}},
      el('div',{className:'modal-h'},
        el('div',{className:'modal-icon',style:{fontSize:22}},allDone?'🎉':'🔧'),
        el('div',null,
          el('p',{style:{fontSize:14,fontWeight:600,marginBottom:2}},
            allDone?'BixDot is ready!':'Set up BixDot'
          ),
          el('p',{style:{fontSize:11,color:'var(--muted)'}},
            allDone?'Starting chat…':'Complete the steps below to get started')
        )
      ),
      el('div',{className:'modal-body'},
        steps.map((s,i)=>el('div',{key:s.id,style:{display:'flex',gap:12,marginBottom:14,alignItems:'flex-start'}},
          el('div',{style:{
            width:22,height:22,borderRadius:'50%',flexShrink:0,marginTop:1,
            background:s.done?'var(--accent)':'var(--card)',
            border:'2px solid '+(s.done?'var(--accent)':'var(--border)'),
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:11,fontWeight:700,color:s.done?'#080c10':'var(--muted)',
          }},s.done?'✓':(i+1)),
          el('div',null,
            el('p',{style:{fontSize:13,fontWeight:500,marginBottom:3,color:s.done?'var(--accent)':'var(--text)'}},s.label),
            !s.done&&el('div',{style:{fontSize:12,color:'var(--muted)',lineHeight:1.5}},s.desc)
          )
        )),
        el('div',{style:{fontSize:11,color:'var(--muted)',marginTop:4}},
          checking?'Checking…':
          allDone?'All set — launching BixDot':
          'This page checks every 4 seconds. Complete the steps above, then it will open automatically.'
        )
      ),
      !allDone&&el('div',{className:'modal-btns'},
        el('button',{className:'btn btn-deny',onClick:onDismiss,style:{flex:'0 0 auto',padding:'9px 18px'}},'Skip for now'),
        el('button',{className:'btn btn-allow',onClick:check,disabled:checking},checking?'Checking…':'Check again')
      )
    )
  );
}

// ── Model mode badge ──────────────────────────────────────────────────────────

// ── Create Session Modal ──────────────────────────────────────────────────────
function CreateSessionModal({token,onClose,onCreate}){
  const[name,setName]=useState('New Chat');
  const[models,setModels]=useState([]);
  const[personas,setPersonas]=useState([]);
  const[personaId,setPersonaId]=useState('bixdot');
  const[ollamaUp,setOllamaUp]=useState(true);
  const[sel,setSel]=useState('');
  const[priv,setPriv]=useState(false);
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState('');

  useEffect(()=>{
    api('/agent/models',{},token).then(r=>{
      setModels(r.models||[]); setOllamaUp(r.ollama_available!==false);
      const def=(r.models||[]).find(m=>m.is_default)||(r.models||[])[0];
      if(def) setSel(def.name);
    }).catch(()=>setOllamaUp(false));
    api('/agent/personas',{},token).then(setPersonas).catch(()=>{});
  },[token]);

  const pickPersona=(p)=>{
    setPersonaId(p.persona_id);
    if(p.model){ const m=models.find(x=>x.name===p.model); if(m&&!m.is_cloud) setSel(p.model); }
  };
  const activePersona=personas.find(p=>p.persona_id===personaId);

  const groups=[
    ['FULL_AGENT','✅ Full Agent','All skills available'],
    ['THINKING','🧠 Reasoning','Chat only, shows reasoning'],
    ['TEXT_ONLY','💬 Chat Only','No skills available'],
    ['CLOUD','☁️ Cloud','Data leaves your device'],
  ];

  const create=async()=>{
    setBusy(true); setErr('');
    try{
      const meta=await api('/agent/sessions',{method:'POST',
        body:JSON.stringify({name:name||'New Chat',model:sel,is_private:priv,persona_id:personaId})},token);
      onCreate(meta);
    }catch(e){ setErr(e.message); setBusy(false); }
  };

  return el('div',{className:'modal-bg'},
    el('div',{className:'modal',style:{maxWidth:420,maxHeight:'85vh',overflowY:'auto'}},
      el('div',{className:'modal-h'},
        el('div',{className:'modal-icon'},'💬'),
        el('div',null,
          el('p',{style:{fontSize:14,fontWeight:600,marginBottom:2}},'New session'),
          el('p',{style:{fontSize:11,color:'var(--muted)'}},'Pick a name, model, and privacy')
        )
      ),
      el('div',{className:'modal-body'},
        el('div',{className:'field'},
          el('label',null,'Name'),
          el('input',{value:name,autoFocus:true,onChange:e=>setName(e.target.value),
            onKeyDown:e=>e.key==='Enter'&&create()})
        ),
        personas.length>0&&el('div',null,
          el('div',{style:{margin:'6px 0',fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)',textTransform:'uppercase',letterSpacing:'.08em'}},'Who answers'),
          el('div',{className:'pchips'},
            personas.map(p=>el('button',{key:p.persona_id,
              className:'pchip'+(personaId===p.persona_id?' sel':''),
              title:p.description,
              onClick:()=>pickPersona(p)},p.icon+' '+p.name))
          ),
          activePersona&&activePersona.description&&el('div',{style:{fontSize:11,color:'var(--muted)',marginTop:-6,marginBottom:8}},activePersona.description)
        ),
        el('div',{style:{margin:'10px 0 6px',fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)',textTransform:'uppercase',letterSpacing:'.08em'}},'Model'),
        !ollamaUp&&el('div',{className:'mp-warn'},'Ollama is not running. Start Ollama to see available models.'),
        ollamaUp&&models.length===0&&el('div',{style:{fontSize:12,color:'var(--muted)'}},'No models found. Try: ',el('code',{style:{color:'var(--accent)'}},'ollama pull llama3.2')),
        groups.map(([mode,label,desc])=>{
          const list=models.filter(m=>m.mode===mode);
          if(list.length===0) return null;
          return el('div',{key:mode,className:'mp-group'},
            el('div',{className:'mp-ghead',style:{color:(MODE_BADGE[mode]||{}).color}},label,
              el('span',{style:{color:'var(--muted)',fontWeight:400,fontSize:10}},'— '+desc)),
            mode==='CLOUD'&&el('div',{className:'mp-warn'},'⚠️ Cloud models send your messages to external servers. This breaks BixDot’s local-first guarantee and is blocked at creation.'),
            list.map(m=>el('div',{key:m.name,
              className:'mp-item'+(sel===m.name?' sel':'')+(m.is_cloud?' disabled':''),
              onClick:()=>{ if(!m.is_cloud) setSel(m.name); },
            },
              el('span',null,m.name+(m.supports_vision?' 👁':'')),
              el('span',{style:{color:'var(--muted)',fontFamily:'var(--mono)'}},(m.size_gb>0?m.size_gb+' GB':''))
            ))
          );
        }),
        el('div',{className:'s-row',style:{padding:'10px 0 2px',borderBottom:'none'}},
          el('div',{className:'s-info'},
            el('p',{style:{margin:0}},'🔒 Private Session'),
            el('span',null,'No history saved. Messages deleted when the session closes.')
          ),
          el('button',{className:'toggle'+(priv?' on':''),onClick:()=>setPriv(p=>!p)})
        ),
        err&&el('div',{className:'err-box',style:{marginTop:8}},err)
      ),
      el('div',{className:'modal-btns'},
        el('button',{className:'btn btn-deny',onClick:onClose},'Cancel'),
        el('button',{className:'btn btn-allow',onClick:create,disabled:busy||(!sel&&ollamaUp&&models.length>0)},busy?'Creating…':'Create')
      )
    )
  );
}

// ── Chat (multi-session) ──────────────────────────────────────────────────────
function Chat({token,model}){
  const[sessions,setSessions]=useState([]);
  const[archived,setArchived]=useState([]);
  const[active,setActive]=useState(null);
  const[msgs,setMsgs]=useState([]);
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const[status,setStatus]=useState('');
  const[pendingPerm,setPendingPerm]=useState(null);
  const[pendingMsg,setPendingMsg]=useState(null);
  const[showCreate,setShowCreate]=useState(false);
  const[showArch,setShowArch]=useState(false);
  const[menuId,setMenuId]=useState(null);
  const[renameId,setRenameId]=useState(null);
  const[renameVal,setRenameVal]=useState('');
  const[personaMap,setPersonaMap]=useState({});
  const bottom=useRef(null);
  const addMsg=(role,text)=>setMsgs(m=>[...m,{role,text}]);

  useEffect(()=>{
    api('/agent/personas',{},token).then(ps=>{
      const m={}; (ps||[]).forEach(p=>{m[p.persona_id]=p;}); setPersonaMap(m);
    }).catch(()=>{});
  },[token]);
  const pIcon=(s)=>s.persona_id&&personaMap[s.persona_id]?personaMap[s.persona_id].icon:null;

  const loadSessions=useCallback(async()=>{
    try{
      const act=await api('/agent/sessions',{},token);
      setSessions(act||[]);
      const all=await api('/agent/sessions?include_archived=true',{},token);
      setArchived((all||[]).filter(s=>s.is_archived));
      return act||[];
    }catch(e){ return []; }
  },[token]);

  const loadMessages=useCallback(async(meta)=>{
    if(!meta){ setMsgs([]); return; }
    try{
      const r=await api('/agent/sessions/'+meta.session_id+'/messages',{},token);
      setMsgs((r.messages||[]).map(m=>({role:m.role,text:m.content})));
    }catch(e){ setMsgs([]); }
    setStatus((meta.is_private?'Private · ':'Ready · ')+(meta.model||'local'));
  },[token]);

  const selectSession=async(meta)=>{
    setMenuId(null);
    if(active&&active.is_private&&active.session_id!==meta.session_id){
      if(!window.confirm('Leave private session? All messages will be deleted permanently.')) return;
      await api('/agent/sessions/'+active.session_id,{method:'DELETE'},token).catch(()=>{});
    }
    setActive(meta); loadMessages(meta);
  };

  useEffect(()=>{
    loadSessions().then(list=>{
      if(list&&list.length>0){ setActive(list[0]); loadMessages(list[0]); }
      else { setShowCreate(true); }
    });
  },[token]);
  useEffect(()=>{ bottom.current?.scrollIntoView({behavior:'smooth'}); },[msgs,loading]);

  const onCreate=(meta)=>{ setShowCreate(false); setActive(meta); setMsgs([]);
    setStatus((meta.is_private?'Private · ':'Ready · ')+(meta.model||'local')); loadSessions(); };

  const newPrivate=async()=>{
    try{
      const meta=await api('/agent/sessions',{method:'POST',
        body:JSON.stringify({name:'Private Session',is_private:true})},token);
      onCreate(meta);
    }catch(e){ alert(e.message); }
  };

  const send=async(text)=>{
    if(!text.trim()||loading||!active) return;
    setInput(''); addMsg('user',text); setLoading(true); setStatus('Thinking…');
    try{
      const r=await api('/agent/chat',{method:'POST',
        body:JSON.stringify({message:text,session_id:active.session_id})},token);
      if(r.permissions_requested?.length>0){
        setPendingPerm(r.permissions_requested[0]); setPendingMsg(text);
        addMsg('sys','Permission needed: "'+r.permissions_requested[0]+'" — approve below.');
      } else { addMsg('agent',r.message||'(no response)'); }
      loadSessions();
    }catch(e){ addMsg('err','Error: '+e.message); }
    setLoading(false);
    setStatus((active.is_private?'Private · ':'Ready · ')+(active.model||'local'));
  };

  const allowPerm=async()=>{
    const cap=pendingPerm, msg=pendingMsg;
    setPendingPerm(null); setPendingMsg(null);
    await api('/agent/permissions/grant',{method:'POST',body:JSON.stringify({capability:cap,skill_id:'builtin'})},token).catch(()=>{});
    addMsg('sys','✓ "'+cap+'" granted. Retrying…');
    await send(msg);
  };
  const denyPerm=()=>{ addMsg('agent',"Understood — I won't access that. What else can I help with?"); setPendingPerm(null); setPendingMsg(null); };

  const archiveOrDelete=async(meta)=>{
    setMenuId(null);
    await api('/agent/sessions/'+meta.session_id,{method:'DELETE'},token).catch(()=>{});
    const list=await loadSessions();
    if(active&&active.session_id===meta.session_id){ const next=(list&&list[0])||null; setActive(next); loadMessages(next); }
  };
  const doRename=async(id)=>{
    const nm=renameVal.trim()||'New Chat'; setRenameId(null);
    await api('/agent/sessions/'+id,{method:'PUT',body:JSON.stringify({name:nm})},token).catch(()=>{});
    loadSessions(); if(active&&active.session_id===id) setActive({...active,name:nm});
  };
  const restore=async(meta)=>{ await api('/agent/sessions/'+meta.session_id,{method:'PUT',body:JSON.stringify({is_archived:false})},token).catch(()=>{}); loadSessions(); };

  const sitem=(s)=>el('div',{key:s.session_id,
      className:'sitem'+(active&&active.session_id===s.session_id?' active':'')+(s.is_private?' priv':''),
      onClick:()=>renameId!==s.session_id&&selectSession(s)},
    el('div',{className:'sitem-top'},
      s.is_private&&el('span',{title:'Private'},'🔒'),
      !s.is_private&&pIcon(s)&&el('span',{title:(personaMap[s.persona_id]||{}).name},pIcon(s)),
      renameId===s.session_id
        ? el('input',{className:'sitem-rename',value:renameVal,autoFocus:true,
            onClick:e=>e.stopPropagation(),
            onChange:e=>setRenameVal(e.target.value),
            onKeyDown:e=>{ if(e.key==='Enter')doRename(s.session_id); if(e.key==='Escape')setRenameId(null); },
            onBlur:()=>doRename(s.session_id)})
        : el('span',{className:'sitem-name',onDoubleClick:e=>{e.stopPropagation();setRenameId(s.session_id);setRenameVal(s.name);}},s.name),
      el(ModeBadge,{mode:s.model_mode})
    ),
    s.last_message_preview&&el('div',{className:'sitem-prev'},s.last_message_preview),
    el('button',{className:'sitem-menu',onClick:e=>{e.stopPropagation();setMenuId(menuId===s.session_id?null:s.session_id);}},'⋯'),
    menuId===s.session_id&&el('div',{className:'smenu',onClick:e=>e.stopPropagation()},
      el('button',{onClick:()=>{setRenameId(s.session_id);setRenameVal(s.name);setMenuId(null);}},'Rename'),
      el('button',{className:'danger',onClick:()=>archiveOrDelete(s)},s.is_private?'Delete':'Archive')
    )
  );

  return el('div',{className:'chat-wrap'},
    el('div',{className:'srail'},
      el('div',{className:'srail-head'},
        el('button',{className:'srail-btn',onClick:()=>setShowCreate(true)},'＋ New Chat'),
        el('button',{className:'srail-btn priv',onClick:newPrivate},'🔒 New Private Session')
      ),
      el('div',{className:'srail-list'},
        sessions.length===0&&el('div',{style:{fontSize:11,color:'var(--muted)',padding:'10px'}},'No sessions yet.'),
        sessions.map(sitem)
      ),
      archived.length>0&&el('div',{className:'srail-arch'},
        el('div',{className:'srail-arch-h',onClick:()=>setShowArch(a=>!a)},(showArch?'▾':'▸')+' Archived ('+archived.length+')'),
        showArch&&archived.map(s=>el('div',{key:s.session_id,className:'sitem',onClick:()=>restore(s),title:'Click to restore'},
          el('div',{className:'sitem-top'},el('span',{className:'sitem-name',style:{color:'var(--muted)'}},s.name),el('span',{style:{fontSize:9,color:'var(--accent)'}},'restore'))
        ))
      )
    ),
    el('div',{className:'chat-pane'},
      active&&el('div',{className:'chat-header'},
        el('span',{className:'chat-header-name',title:'Click to rename',
          onClick:()=>{setRenameId(active.session_id);setRenameVal(active.name);}},
          (pIcon(active)?pIcon(active)+' ':'')+active.name),
        el('div',{style:{display:'flex',alignItems:'center',gap:8}},
          active.model&&el('span',{style:{fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)'}},active.model),
          el(ModeBadge,{mode:active.model_mode})
        )
      ),
      msgs.length===0
        ? el('div',{className:'empty'},
            el('div',{className:'logo-dot',style:{width:10,height:10}}),
            el('p',null,active?'Start chatting — your data never leaves this machine.':'Create a session to begin.'),
            active&&el('p',{style:{fontSize:12}},'Try: "What can you do?" or "Hello!"')
          )
        : el('div',{className:'chat-body'},
            msgs.map((m,i)=>el('div',{key:i,className:'msg-row '+(m.role==='user'?'user':'')},
              el('div',{className:'msg '+(m.role==='err'?'err':m.role==='sys'?'sys':m.role)},m.text)
            )),
            loading&&el('div',{className:'msg-row'},el('div',{className:'typing'},el('span'),el('span'),el('span'))),
            el('div',{ref:bottom})
          ),
      active&&active.is_private&&el('div',{className:'priv-banner'},
        '🔒 Private Session — No history saved. Messages deleted when this session closes.'),
      el('div',{className:'chat-input'},
        el('input',{value:input,onChange:e=>setInput(e.target.value),
          onKeyDown:e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(input); } },
          placeholder:loading?'BixDot is thinking…':active?'Ask BixDot anything…':'Create a session first',
          disabled:loading||!active,autoFocus:true}),
        el('button',{className:'send-btn',onClick:()=>send(input),disabled:loading||!input.trim()||!active},
          el(SVG,{d:SEND_ICON,size:14}))
      )
    ),
    showCreate&&el(CreateSessionModal,{token,onClose:()=>{setShowCreate(false);},onCreate}),
    pendingPerm&&el(PermModal,{cap:pendingPerm,onAllow:allowPerm,onDeny:denyPerm})
  );
}

// ── Audit ─────────────────────────────────────────────────────────────────────
function Audit({token}){
  const[logs,setLogs]=useState([]);
  const load=()=>api('/agent/audit?limit=50',{},token).then(setLogs).catch(()=>{});
  useEffect(()=>{ load(); const iv=setInterval(load,3000); return ()=>clearInterval(iv); },[token]);
  const cls=e=>e.includes('permission')?'evt-g':e.includes('file')||e.includes('data')?'evt-b':e.includes('auth')?'evt-w':'evt-n';
  return el('div',{className:'audit-body'},
    logs.length===0&&el('div',{className:'empty'},el('p',null,'No activity yet. Start chatting to see the audit log.')),
    logs.map((l,i)=>el('div',{key:i,className:'audit-row'},
      el('span',{className:'audit-time'},new Date(l.timestamp).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',second:'2-digit'})),
      el('div',null,
        el('span',{className:'evt '+cls(l.event)},l.event),
        el('div',{className:'audit-detail'},JSON.stringify(l.details).slice(0,90))
      )
    ))
  );
}


// ── Calendar Settings ─────────────────────────────────────────────────────────
function CalendarSettings({token}){
  const[status,setStatus]=useState(null);
  const[showGoogle,setShowGoogle]=useState(false);
  const[showOutlook,setShowOutlook]=useState(false);
  const[showIcal,setShowIcal]=useState(false);
  const[cid,setCid]=useState('');
  const[csec,setCsec]=useState('');
  const[msCid,setMsCid]=useState('');
  const[msCsec,setMsCsec]=useState('');
  const[icalPath,setIcalPath]=useState('');
  const[connecting,setConnecting]=useState(false);
  const[msg,setMsg]=useState('');

  const load=()=>api('/calendar/status',{},token).then(setStatus).catch(()=>{});
  useEffect(()=>{load();},[token]);

  const connectGoogle=async()=>{
    if(!cid) return;
    setConnecting(true); setMsg('');
    try{
      const r=await api('/calendar/connect/google',{method:'POST',body:JSON.stringify({client_id:cid,client_secret:csec})},token);
      window.open(r.auth_url,'_blank');
      setMsg('Browser tab opened — sign in with Google, then come back and refresh.');
      setShowGoogle(false);
    }catch(e){ setMsg('Error: '+e.message); }
    setConnecting(false);
  };

  const connectMicrosoft=async()=>{
    if(!msCid) return;
    setConnecting(true); setMsg('');
    try{
      const r=await api('/calendar/connect/microsoft',{method:'POST',body:JSON.stringify({client_id:msCid,client_secret:msCsec})},token);
      window.open(r.auth_url,'_blank');
      setMsg('Browser tab opened — sign in with your Microsoft account, then come back and refresh.');
      setShowOutlook(false);
    }catch(e){ setMsg('Error: '+e.message); }
    setConnecting(false);
  };

  const connectIcal=async()=>{
    if(!icalPath) return;
    setConnecting(true); setMsg('');
    try{
      await api('/calendar/connect/ical',{method:'POST',body:JSON.stringify({file_path:icalPath})},token);
      setMsg('Local calendar file connected!');
      setShowIcal(false);
      load();
    }catch(e){ setMsg('Error: '+e.message); }
    setConnecting(false);
  };

  const disconnect=async(provider)=>{
    await api('/calendar/disconnect/'+provider,{method:'DELETE'},token).catch(()=>{});
    load();
  };

  if(!status) return el('div',{className:'s-card'},el('div',{className:'s-row'},el('span',{style:{fontSize:12,color:'var(--muted)'}},'Loading…')));

  const providers=status.providers||[];

  return el('div',{className:'s-card'},
    // Google Calendar row
    el('div',{className:'provider-card'},
      el('div',{className:'provider-info'},
        el('p',null,'Google Calendar'),
        el('span',null,providers.includes('google')?'Connected':'Not connected')
      ),
      providers.includes('google')
        ? el('button',{className:'revoke-btn',onClick:()=>disconnect('google')},'Disconnect')
        : el('button',{className:'connect-btn',onClick:()=>{ setShowGoogle(s=>!s); setShowIcal(false); }},'Connect')
    ),
    showGoogle&&el('div',{className:'setup-form'},
      el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:8,lineHeight:1.5}},'Enter your Google OAuth credentials. ',el('a',{href:'https://console.cloud.google.com',target:'_blank',style:{color:'var(--accent)'}},'Get them here'),' → Enable Calendar API → Create OAuth 2.0 credentials → Web app → Redirect: http://127.0.0.1:8747/calendar/oauth/callback'),
      el('input',{className:'setup-input',placeholder:'Client ID (ends with .apps.googleusercontent.com)',value:cid,onChange:e=>setCid(e.target.value)}),
      el('input',{className:'setup-input',placeholder:'Client Secret',type:'password',value:csec,onChange:e=>setCsec(e.target.value)}),
      el('button',{className:'connect-btn',onClick:connectGoogle,disabled:connecting||!cid},connecting?'Opening…':'Open Google sign-in')
    ),

    // Outlook / Microsoft 365 row
    el('div',{className:'provider-card'},
      el('div',{className:'provider-info'},
        el('p',null,'Outlook / Microsoft 365'),
        el('span',null,providers.includes('outlook')?'Connected':'Not connected')
      ),
      providers.includes('outlook')
        ? el('button',{className:'revoke-btn',onClick:()=>disconnect('outlook')},'Disconnect')
        : el('button',{className:'connect-btn',onClick:()=>{ setShowOutlook(s=>!s); setShowGoogle(false); setShowIcal(false); }},'Connect')
    ),
    showOutlook&&el('div',{className:'setup-form'},
      el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:8,lineHeight:1.5}},
        'Register an app at ',
        el('a',{href:'https://portal.azure.com',target:'_blank',rel:'noreferrer',style:{color:'var(--accent)'}},'portal.azure.com'),
        ' → App registrations → New registration → Redirect URI: ',
        el('code',{style:{fontFamily:'var(--mono)',color:'var(--accent)'}},'http://127.0.0.1:8747/calendar/oauth/microsoft/callback'),
        '. Permissions: Calendars.Read, Calendars.ReadWrite, offline_access, User.Read'
      ),
      el('input',{className:'setup-input',placeholder:'Application (client) ID',value:msCid,onChange:e=>setMsCid(e.target.value)}),
      el('input',{className:'setup-input',placeholder:'Client Secret',type:'password',value:msCsec,onChange:e=>setMsCsec(e.target.value)}),
      el('button',{className:'connect-btn',onClick:connectMicrosoft,disabled:connecting||!msCid},connecting?'Opening…':'Open Microsoft sign-in')
    ),

    // Local .ics row
    el('div',{className:'provider-card'},
      el('div',{className:'provider-info'},
        el('p',null,'Local .ics file'),
        el('span',null,providers.includes('ical')?'Connected':'No auth needed')
      ),
      providers.includes('ical')
        ? el('button',{className:'revoke-btn',onClick:()=>disconnect('ical')},'Disconnect')
        : el('button',{className:'connect-btn',onClick:()=>{ setShowIcal(s=>!s); setShowGoogle(false); }},'Connect')
    ),
    showIcal&&el('div',{className:'setup-form'},
      el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:8,lineHeight:1.5}},'Path to your .ics file. Export from Google Calendar (Settings → Export) or Outlook (File → Save Calendar).'),
      el('input',{className:'setup-input',placeholder:'C:\\Users\\you\\calendar.ics or ~/calendar.ics',value:icalPath,onChange:e=>setIcalPath(e.target.value)}),
      el('button',{className:'connect-btn',onClick:connectIcal,disabled:connecting||!icalPath},connecting?'Connecting…':'Connect file')
    ),

    msg&&el('div',{style:{padding:'8px 14px',fontSize:12,color:'var(--accent)',background:'var(--accent-dim)',borderTop:'1px solid var(--border)'}},msg)
  );
}

// ── Skills Panel (third-party skill plugins) ──────────────────────────────────
async function uploadSkill(path,token,file){
  const fd=new FormData(); fd.append('file',file,file.name);
  const r=await fetch('http://localhost:8747'+path,{method:'POST',
    headers:{'Authorization':'Bearer '+token},body:fd});
  if(!r.ok){ let m=r.statusText; try{const e=await r.json();m=e.detail||m;}catch(e){} throw new Error(m); }
  return r.json();
}
function SkillsPanel({token}){
  const[skills,setSkills]=useState([]);
  const[pending,setPending]=useState(null); // {file, manifest} awaiting approval
  const[busy,setBusy]=useState(false);
  const[msg,setMsg]=useState('');
  const fileRef=useRef(null);

  const load=()=>api('/agent/skills',{},token).then(setSkills).catch(()=>{});
  useEffect(()=>{load();},[token]);

  const onFile=async(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file) return;
    setBusy(true); setMsg('');
    try{
      const manifest=await uploadSkill('/agent/skills/inspect',token,file);
      setPending({file,manifest});
    }catch(err){ setMsg('Rejected: '+err.message); }
    setBusy(false);
    if(fileRef.current) fileRef.current.value='';
  };

  const approve=async()=>{
    if(!pending) return;
    setBusy(true); setMsg('');
    try{
      await uploadSkill('/agent/skills/install',token,pending.file);
      setMsg('✓ Installed "'+pending.manifest.name+'"'); setPending(null); load();
    }catch(err){ setMsg('Install failed: '+err.message); }
    setBusy(false);
  };

  const toggle=async(s)=>{
    await api('/agent/skills/'+s.skill_id+'/toggle',{method:'PUT',body:JSON.stringify({enabled:!s.is_enabled})},token).catch(()=>{});
    load();
  };
  const remove=async(s)=>{
    if(!confirm('Uninstall skill "'+s.name+'"? This deletes its files.')) return;
    await api('/agent/skills/'+s.skill_id,{method:'DELETE'},token).catch(()=>{});
    setMsg('Skill removed.'); load();
  };

  return el('div',{className:'s-card'},
    skills.length===0&&!pending&&el('div',{className:'s-row'},
      el('div',{className:'s-info'},
        el('p',null,'No skills installed'),
        el('span',null,'Install a .zip skill to extend BixDot. Code is SHA-256 verified and sandboxed.')
      )
    ),
    skills.map(s=>el('div',{key:s.skill_id,className:'s-row',style:{flexWrap:'wrap',gap:6}},
      el('div',{className:'s-info',style:{flex:1,minWidth:0}},
        el('p',null,s.name+' ',el('span',{style:{fontSize:10,color:'var(--muted)',fontFamily:'var(--mono)'}},'v'+s.version)),
        el('span',null,s.author+' · '+s.license),
        s.capabilities.length>0&&el('div',{style:{display:'flex',flexWrap:'wrap',gap:4,marginTop:4}},
          s.capabilities.map(c=>el('span',{key:c,className:'skill-cap'},c))
        )
      ),
      el('div',{style:{display:'flex',gap:6,alignItems:'center',flexShrink:0}},
        el('button',{className:'toggle'+(s.is_enabled?' on':''),onClick:()=>toggle(s),title:s.is_enabled?'Disable':'Enable'}),
        el('button',{className:'revoke-btn',onClick:()=>remove(s)},'Remove')
      )
    )),
    // Capability approval screen
    pending&&el('div',{className:'setup-form'},
      el('div',{style:{fontSize:13,fontWeight:600,marginBottom:4}},pending.manifest.name+' v'+pending.manifest.version),
      el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:8}},pending.manifest.description+' — '+pending.manifest.author+' · '+pending.manifest.license),
      el('div',{style:{fontSize:11,color:'var(--text)',marginBottom:6}},'This skill is requesting these capabilities:'),
      el('div',{style:{display:'flex',flexWrap:'wrap',gap:4,marginBottom:10}},
        (pending.manifest.capabilities||[]).map(c=>el('span',{key:c,className:'skill-cap'},c))
      ),
      el('div',{style:{display:'flex',gap:8}},
        el('button',{className:'btn btn-deny',style:{flex:'0 0 auto',padding:'8px 14px'},onClick:()=>setPending(null)},'Cancel'),
        el('button',{className:'btn btn-allow',style:{flex:'0 0 auto',padding:'8px 14px'},onClick:approve,disabled:busy},busy?'Installing…':'Approve & Install')
      )
    ),
    !pending&&el('div',{className:'s-row',style:{borderTop:skills.length>0?'1px solid var(--border)':'none'}},
      el('button',{className:'connect-btn',style:{fontSize:11},disabled:busy,onClick:()=>fileRef.current&&fileRef.current.click()},busy?'Reading…':'+ Install skill (.zip)'),
      el('input',{ref:fileRef,type:'file',accept:'.zip',style:{display:'none'},onChange:onFile})
    ),
    msg&&el('div',{style:{padding:'8px 14px',fontSize:12,color:'var(--accent)',background:'var(--accent-dim)',borderTop:'1px solid var(--border)'}},msg)
  );
}

// ── Model Selector ─────────────────────────────────────────────────────────────
const MODE_META={
  FULL_AGENT:{label:'Agent',tip:'Supports tool calling — files, web search, calendar, and more.',color:'var(--accent)'},
  THINKING:  {label:'Reasoning',tip:'Chain-of-thought reasoning model. Slower but more thorough. No tool use.',color:'var(--blue)'},
  TEXT_ONLY: {label:'Chat',tip:'Plain text completion. No tool calls. Fast and lightweight.',color:'var(--muted)'},
};

function ModelSelector({token, onModelChange}){
  const[models,setModels]=useState([]);
  const[current,setCurrent]=useState('');
  const[saving,setSaving]=useState(false);
  const[saved,setSaved]=useState(false);

  useEffect(()=>{
    api('/agent/model',{},token).then(r=>setCurrent(r.model)).catch(()=>{});
    api('/agent/models',{},token).then(r=>setModels(r.models||[])).catch(()=>{});
  },[token]);

  const save=async(model)=>{
    setSaving(true); setSaved(false);
    try{
      await api('/agent/model',{method:'POST',body:JSON.stringify({model})},token);
      setCurrent(model);
      setSaved(true);
      if(onModelChange) onModelChange(model);
      setTimeout(()=>setSaved(false),2000);
    }catch(e){}
    setSaving(false);
  };

  // Group models by mode
  const groups={FULL_AGENT:[],THINKING:[],TEXT_ONLY:[]};
  models.forEach(m=>{if(groups[m.mode])groups[m.mode].push(m);});
  const currentInfo=models.find(m=>m.name===current);
  const modeMeta=currentInfo&&MODE_META[currentInfo.mode];

  const selectEl=models.length>0
    ? el('select',{
        style:{background:'var(--card)',border:'1px solid var(--border)',color:'var(--text)',
               borderRadius:7,padding:'5px 8px',fontSize:12,cursor:'pointer'},
        value:current,
        onChange:e=>save(e.target.value),
        disabled:saving,
      },
      Object.entries(groups).filter(([,ms])=>ms.length>0).map(([mode,ms])=>
        el('optgroup',{key:mode,label:MODE_META[mode]?.label||mode},
          ms.map(m=>el('option',{key:m.name,value:m.name},
            m.name+(m.size_gb>0?' ('+m.size_gb+'GB)':'')+(m.supports_vision?' 👁':'')
          ))
        )
      )
    )
    : el('span',{style:{fontSize:12,fontFamily:'var(--mono)',color:'var(--muted)'}},current||'llama3.2');

  return el('div',{className:'s-card'},
    el('div',{className:'s-row'},
      el('div',{className:'s-info'},
        el('p',null,'Active model'),
        el('span',null,modeMeta
          ? el('span',null,
              el('span',{style:{color:modeMeta.color,fontWeight:600}},modeMeta.label),
              ' — ',modeMeta.tip
            )
          : 'Runs locally via Ollama · no API key · data never leaves device'
        )
      ),
      el('div',{style:{display:'flex',alignItems:'center',gap:8}},
        selectEl,
        saved&&el('span',{style:{fontSize:11,color:'var(--accent)',fontFamily:'var(--mono)'}},'✓ saved')
      )
    ),
    models.length===0&&el('div',{style:{padding:'8px 14px 10px',fontSize:11,color:'var(--muted)'}},
      'No models found — is Ollama running? Try: ',
      el('code',{style:{fontFamily:'var(--mono)',color:'var(--accent)'}},'ollama pull llama3.2')
    )
  );
}

// ── My Files / Ask anything (v0.6) ────────────────────────────────────────────
function MyFilesPanel({token}){
  const[st,setSt]=useState(null);
  const[path,setPath]=useState('');
  const[busy,setBusy]=useState(false);
  const[msg,setMsg]=useState('');
  const[dl,setDl]=useState(null);

  const load=()=>{api('/agent/knowledge/status',{},token).then(setSt).catch(()=>{});};
  useEffect(()=>{load(); const iv=setInterval(load,15000); return()=>clearInterval(iv);},[token]);

  const addFolder=async()=>{
    if(!path.trim())return;
    setBusy(true); setMsg('');
    try{
      await api('/agent/knowledge/folders',{method:'POST',body:JSON.stringify({path})},token);
      setPath(''); setMsg('✓ Folder added — indexing runs in the background.');
      api('/agent/knowledge/reindex',{method:'POST'},token).catch(()=>{});
      load();
    }catch(e){ setMsg('Error: '+e.message); }
    setBusy(false);
  };
  const removeFolder=async(f)=>{
    if(!confirm('Stop indexing "'+f.path+'"? Its index is deleted (files are untouched).'))return;
    await api('/agent/knowledge/folders/'+f.folder_id,{method:'DELETE'},token).catch(()=>{});
    load();
  };
  const reindex=async()=>{
    setBusy(true); setMsg('');
    try{ const r=await api('/agent/knowledge/reindex',{method:'POST'},token);
      setMsg('✓ Indexed '+r.indexed+' file(s) — the rest continue in the background.'); load();
    }catch(e){ setMsg('Error: '+e.message); }
    setBusy(false);
  };
  const pullEmbed=async()=>{
    setDl({pct:0,status:'Starting…'});
    try{
      const r=await fetch('http://localhost:8747/agent/models/pull',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({model:'nomic-embed-text'})});
      const reader=r.body.getReader(); const dec=new TextDecoder(); let buf='';
      while(true){const{done,value}=await reader.read(); if(done)break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop();
        for(const ln of lines){ if(!ln.trim())continue;
          try{const j=JSON.parse(ln);
            if(j.error){setDl({pct:0,status:j.error,err:true});return;}
            if(j.total&&j.completed!=null)setDl({pct:Math.round(j.completed/j.total*100),status:'Downloading…'});
          }catch(e){}}}
      setDl(null); load();
    }catch(e){ setDl({pct:0,status:'Failed: '+e.message,err:true}); }
  };

  if(!st) return el('div',{className:'s-card'},el('div',{className:'s-row'},el('span',{style:{fontSize:12,color:'var(--muted)'}},'Loading…')));

  return el('div',{className:'s-card'},
    el('div',{className:'s-row'},
      el('div',{className:'s-info'},
        el('p',null,'Ask anything about your files'),
        el('span',null,'BixDot indexes chosen folders on this device — nothing is uploaded, ever.')
      ),
      st.total_chunks>0&&el('span',{className:'s-active'},st.total_files+' files · '+st.total_chunks+' pieces')
    ),
    !st.embedding_model&&el('div',{className:'setup-form'},
      el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:6,lineHeight:1.5}},
        'This needs a small local "understanding" model (~270 MB, one-time).'),
      dl&&el('div',null,el('div',{className:'dlbar'},el('div',{style:{width:(dl.pct||0)+'%'}})),
        el('div',{style:{fontSize:11,color:dl.err?'var(--red)':'var(--muted)'}},(dl.pct?dl.pct+'% · ':'')+dl.status)),
      (!dl||dl.err)&&el('button',{className:'connect-btn',onClick:pullEmbed},'⬇ Download nomic-embed-text')
    ),
    st.embedding_model&&el('div',null,
      (st.folders||[]).map(f=>el('div',{key:f.folder_id,className:'s-row'},
        el('div',{className:'s-info'},
          el('p',{style:{fontFamily:'var(--mono)',fontSize:12}},f.path),
          el('span',null,f.files_indexed+' indexed'+(f.files_pending>0?' · '+f.files_pending+' pending':'')+' · '+f.chunks+' pieces')
        ),
        el('button',{className:'revoke-btn',onClick:()=>removeFolder(f)},'Remove')
      )),
      el('div',{className:'setup-form'},
        el('input',{className:'setup-input',placeholder:'C:\\Users\\you\\Documents',value:path,
          onChange:e=>setPath(e.target.value),onKeyDown:e=>e.key==='Enter'&&addFolder()}),
        el('div',{style:{display:'flex',gap:8}},
          el('button',{className:'connect-btn',onClick:addFolder,disabled:busy||!path.trim()},'+ Add folder'),
          (st.folders||[]).length>0&&el('button',{className:'cal-btn-sec',style:{fontSize:12,padding:'5px 12px'},onClick:reindex,disabled:busy},busy?'Working…':'Index now')
        )
      )
    ),
    msg&&el('div',{style:{padding:'8px 14px',fontSize:12,color:'var(--accent)',background:'var(--accent-dim)',borderTop:'1px solid var(--border)'}},msg)
  );
}

// ── Telegram Settings (v0.5) ──────────────────────────────────────────────────
function TelegramSettings({token}){
  const[st,setSt]=useState(null);
  const[tok,setTok]=useState('');
  const[busy,setBusy]=useState(false);
  const[msg,setMsg]=useState('');
  const[code,setCode]=useState(null);

  const load=()=>{api('/agent/telegram/status',{},token).then(setSt).catch(()=>{});};
  useEffect(()=>{load();},[token]);

  const connect=async()=>{
    if(!tok.trim())return;
    setBusy(true); setMsg('');
    try{
      const r=await api('/agent/telegram/connect',{method:'POST',body:JSON.stringify({token:tok})},token);
      setMsg('✓ Connected to @'+r.bot_username); setTok(''); load();
    }catch(e){ setMsg('Error: '+e.message); }
    setBusy(false);
  };
  const disconnect=async()=>{
    if(!confirm('Disconnect Telegram? All paired phones lose access.'))return;
    await api('/agent/telegram/disconnect',{method:'POST'},token).catch(()=>{});
    setCode(null); load();
  };
  const pair=async()=>{
    setMsg('');
    try{ setCode(await api('/agent/telegram/pair',{method:'POST',body:JSON.stringify({})},token)); }
    catch(e){ setMsg('Error: '+e.message); }
  };
  const unpair=async(chatId)=>{ await api('/agent/telegram/pairings/'+chatId,{method:'DELETE'},token).catch(()=>{}); load(); };

  if(!st) return el('div',{className:'s-card'},el('div',{className:'s-row'},el('span',{style:{fontSize:12,color:'var(--muted)'}},'Loading…')));

  return el('div',{className:'s-card'},
    !st.enabled&&el('div',{className:'setup-form',style:{borderTop:'none'}},
      el('div',{style:{fontSize:12,color:'var(--text)',marginBottom:4,fontWeight:500}},'Chat with BixDot from your phone'),
      el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:8,lineHeight:1.6}},
        '1. On Telegram, message ',el('code',{style:{color:'var(--accent)'}},'@BotFather'),' and send ',el('code',{style:{color:'var(--accent)'}},'/newbot'),el('br'),
        '2. Paste the token BotFather gives you below.',el('br'),
        'Your agent keeps running on THIS computer — nothing is exposed.'),
      el('input',{className:'setup-input',placeholder:'123456789:ABCdef…',value:tok,onChange:e=>setTok(e.target.value),type:'password'}),
      el('button',{className:'connect-btn',onClick:connect,disabled:busy||!tok.trim()},busy?'Connecting…':'Connect bot')
    ),
    st.enabled&&el('div',null,
      el('div',{className:'s-row'},
        el('div',{className:'s-info'},
          el('p',null,'Connected to @'+st.bot_username),
          el('span',null,(st.pairings||[]).length+' paired device(s)')
        ),
        el('button',{className:'revoke-btn',onClick:disconnect},'Disconnect')
      ),
      el('div',{className:'setup-form'},
        el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:6}},'To pair your phone: get a code, then send it to @'+st.bot_username+' on Telegram within 5 minutes.'),
        code&&el('div',{className:'paircode'},code.code),
        el('button',{className:'connect-btn',onClick:pair},code?'New code':'Get pairing code')
      ),
      (st.pairings||[]).map(p=>el('div',{key:p.chat_id,className:'s-row'},
        el('div',{className:'s-info'},el('p',null,'Chat '+p.chat_id),el('span',null,'Paired '+new Date(p.paired_at).toLocaleDateString())),
        el('button',{className:'revoke-btn',onClick:()=>unpair(p.chat_id)},'Unpair')
      ))
    ),
    msg&&el('div',{style:{padding:'8px 14px',fontSize:12,color:'var(--accent)',background:'var(--accent-dim)',borderTop:'1px solid var(--border)'}},msg)
  );
}

// ── Personas Panel (v0.5) ─────────────────────────────────────────────────────
function PersonasPanel({token}){
  const[personas,setPersonas]=useState([]);
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState({});
  const[msg,setMsg]=useState('');

  const load=()=>{api('/agent/personas',{},token).then(setPersonas).catch(()=>{});};
  useEffect(()=>{load();},[token]);

  const startEdit=(p)=>{ setEditId(p?p.persona_id:'__new'); setForm(p?{name:p.name,icon:p.icon,description:p.description,system_prompt:p.system_prompt}:{name:'',icon:'🤖',description:'',system_prompt:''}); };
  const save=async()=>{
    setMsg('');
    try{
      if(editId==='__new'){ await api('/agent/personas',{method:'POST',body:JSON.stringify(form)},token); }
      else{ await api('/agent/personas/'+editId,{method:'PUT',body:JSON.stringify(form)},token); }
      setEditId(null); load();
    }catch(e){ setMsg('Error: '+e.message); }
  };
  const del=async(p)=>{
    if(!confirm('Delete persona "'+p.name+'"?'))return;
    try{ await api('/agent/personas/'+p.persona_id,{method:'DELETE'},token); load(); }
    catch(e){ setMsg('Error: '+e.message); }
  };

  return el('div',{className:'s-card'},
    personas.map(p=>el('div',{key:p.persona_id,className:'s-row',style:{flexWrap:'wrap'}},
      el('div',{className:'s-info',style:{flex:1}},
        el('p',null,p.icon+' '+p.name+' ',p.is_builtin&&el('span',{style:{fontSize:9,color:'var(--muted)',fontFamily:'var(--mono)'}},'BUILT-IN')),
        el('span',null,p.description)
      ),
      el('div',{style:{display:'flex',gap:6}},
        el('button',{className:'cal-btn-sec',style:{padding:'4px 10px',fontSize:11},onClick:()=>startEdit(p)},'Edit'),
        !p.is_builtin&&el('button',{className:'revoke-btn',onClick:()=>del(p)},'Delete')
      )
    )),
    el('div',{className:'s-row',style:{borderTop:'1px solid var(--border)'}},
      el('button',{className:'connect-btn',style:{fontSize:11},onClick:()=>startEdit(null)},'+ New persona')
    ),
    editId&&el('div',{className:'setup-form'},
      el('div',{style:{display:'flex',gap:8,marginBottom:6}},
        el('input',{className:'setup-input',style:{width:60,marginBottom:0},placeholder:'🤖',value:form.icon||'',onChange:e=>setForm(f=>({...f,icon:e.target.value}))}),
        el('input',{className:'setup-input',style:{marginBottom:0},placeholder:'Name',value:form.name||'',onChange:e=>setForm(f=>({...f,name:e.target.value}))})
      ),
      el('input',{className:'setup-input',placeholder:'Short description',value:form.description||'',onChange:e=>setForm(f=>({...f,description:e.target.value}))}),
      el('textarea',{className:'setup-input',rows:3,style:{resize:'vertical',fontFamily:'inherit'},placeholder:'Instructions — how should this persona behave?',value:form.system_prompt||'',onChange:e=>setForm(f=>({...f,system_prompt:e.target.value}))}),
      el('div',{style:{display:'flex',gap:8}},
        el('button',{className:'connect-btn',onClick:save},'Save'),
        el('button',{className:'cal-btn-sec',style:{padding:'5px 12px',fontSize:12},onClick:()=>setEditId(null)},'Cancel')
      )
    ),
    msg&&el('div',{style:{padding:'8px 14px',fontSize:12,color:'var(--red)',background:'var(--red-dim)',borderTop:'1px solid var(--border)'}},msg)
  );
}

// ── Calendar ──────────────────────────────────────────────────────────────────
function CreateEventModal({token, onClose, onCreated}){
  const[title,setTitle]=useState('');
  const[date,setDate]=useState(new Date().toISOString().split('T')[0]);
  const[time,setTime]=useState('09:00');
  const[duration,setDuration]=useState(60);
  const[desc,setDesc]=useState('');
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState('');

  const create=async()=>{
    if(!title||!date||!time) return;
    setLoading(true); setErr('');
    try{
      const r=await api('/calendar/events',{method:'POST',body:JSON.stringify({title,date,time,duration_minutes:parseInt(duration),description:desc})},token);
      onCreated(r);
    }catch(e){ setErr(e.message); }
    setLoading(false);
  };

  return el('div',{className:'modal-bg'},
    el('div',{className:'modal'},
      el('div',{className:'modal-h'},
        el('div',{className:'modal-icon'},'📅'),
        el('div',null,
          el('p',{style:{fontSize:14,fontWeight:500,marginBottom:2}},'New event'),
          el('p',{style:{fontSize:11,color:'var(--muted)'}},'Add to your calendar')
        )
      ),
      el('div',{className:'create-form'},
        el('div',{className:'form-field'},el('span',{className:'form-label'},'TITLE'),el('input',{className:'form-input',value:title,onChange:e=>setTitle(e.target.value),placeholder:'Meeting with team',autoFocus:true})),
        el('div',{style:{display:'flex',gap:8}},
          el('div',{className:'form-field',style:{flex:1}},el('span',{className:'form-label'},'DATE'),el('input',{className:'form-input',type:'date',value:date,onChange:e=>setDate(e.target.value)})),
          el('div',{className:'form-field',style:{flex:1}},el('span',{className:'form-label'},'TIME'),el('input',{className:'form-input',type:'time',value:time,onChange:e=>setTime(e.target.value)}))
        ),
        el('div',{className:'form-field'},el('span',{className:'form-label'},'DURATION (min)'),el('input',{className:'form-input',type:'number',value:duration,onChange:e=>setDuration(e.target.value),min:15,step:15})),
        el('div',{className:'form-field'},el('span',{className:'form-label'},'DESCRIPTION (optional)'),el('input',{className:'form-input',value:desc,onChange:e=>setDesc(e.target.value),placeholder:'Optional notes'})),
        err&&el('div',{style:{fontSize:12,color:'var(--red)',background:'var(--red-dim)',padding:'6px 8px',borderRadius:6}},err)
      ),
      el('div',{className:'modal-btns'},
        el('button',{className:'btn btn-deny',onClick:onClose},'Cancel'),
        el('button',{className:'btn btn-allow',onClick:create,disabled:loading||!title||!date||!time},loading?'Creating…':'Create event')
      )
    )
  );
}

function Calendar({token}){
  const[events,setEvents]=useState([]);
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState('');
  const[days,setDays]=useState(7);
  const[connected,setConnected]=useState(null);
  const[showCreate,setShowCreate]=useState(false);

  const loadStatus=()=>api('/calendar/status',{},token).then(r=>{setConnected(r);}).catch(()=>setConnected({connected:false,providers:[]}));
  const loadEvents=()=>{
    setLoading(true); setErr('');
    api('/calendar/events?days='+days,{},token)
      .then(r=>{ setEvents(r); setLoading(false); })
      .catch(e=>{ setErr(e.message); setLoading(false); });
  };

  useEffect(()=>{ loadStatus(); },[token]);
  useEffect(()=>{ if(connected&&connected.connected) loadEvents(); else setLoading(false); },[connected,days]);

  if(!connected) return el('div',{className:'cal-body'},el('div',{className:'empty'},el('p',null,'Checking calendar…')));

  if(!connected.connected) return el('div',{className:'cal-body'},
    el('div',{className:'no-cal'},
      el('div',{style:{fontSize:36,marginBottom:8}},'📅'),
      el('p',null,'No calendar connected yet.'),
      el('p',{style:{fontSize:12}},'Go to Settings → Calendar to connect Google Calendar or a local .ics file.'),
    )
  );

  const grouped={};
  events.forEach(e=>{
    const d=e.start.split('T')[0];
    if(!grouped[d]) grouped[d]=[];
    grouped[d].push(e);
  });

  return el('div',{className:'cal-body'},
    el('div',{className:'cal-header'},
      el('span',{className:'cal-title'},'Next '+days+' days · '+events.length+' event'+(events.length!==1?'s':'')),
      el('div',{className:'cal-actions'},
        el('select',{style:{background:'var(--card)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:7,padding:'5px 8px',fontSize:12,cursor:'pointer'},value:days,onChange:e=>setDays(parseInt(e.target.value))},
          el('option',{value:3},'3 days'),
          el('option',{value:7},'7 days'),
          el('option',{value:14},'14 days'),
          el('option',{value:30},'30 days')
        ),
        connected.active_provider==='google'&&el('button',{className:'cal-btn',onClick:()=>setShowCreate(true)},'+ New event'),
        el('button',{className:'cal-btn-sec',onClick:loadEvents},'Refresh')
      )
    ),
    loading&&el('div',{className:'empty'},el('p',null,'Loading events…')),

// ── Privacy Proof (v0.6) ──────────────────────────────────────────────────────
function Privacy({token}){
  const[rep,setRep]=useState(null);
  useEffect(()=>{
    const load=()=>api('/agent/privacy/report',{},token).then(setRep).catch(()=>{});
    load();
    const iv=setInterval(load,5000);
    return()=>clearInterval(iv);
  },[token]);

  if(!rep) return el('div',{className:'priv-body'},el('div',{className:'empty'},el('p',null,'Checking…')));

  const chainOk=rep.audit&&rep.audit.chain_valid;
  const catPill=c=>el('span',{className:'cat-pill cat-'+c},
    c==='local'?'LOCAL':c==='optin'?'YOU ENABLED':'CLOUD');
  const fmtLast=t=>t?new Date(t).toLocaleTimeString():'never';

  return el('div',{className:'priv-body'},
    // The seal
    el('div',{className:'seal'+(chainOk?'':' broken')},
      el('span',{className:'seal-icon'},chainOk?'🛡️':'⚠️'),
      el('div',null,
        el('div',{className:'seal-title'},chainOk
          ?'Verified — nothing has been tampered with'
          :'WARNING — audit log integrity check failed'),
        el('div',{className:'seal-sub'},
          'Tamper-evident audit log: '+(rep.audit.entries||0).toLocaleString()+
