<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BixDot</title>
<style>
  :root {
    --bg:#080c10;--surface:#0f1520;--card:#141d2a;--border:#1e2d40;
    --accent:#00d4aa;--accent-dim:rgba(0,212,170,.10);--accent-mid:rgba(0,212,170,.25);
    --warn:#f5a623;--warn-dim:rgba(245,166,35,.12);
    --red:#ff4757;--red-dim:rgba(255,71,87,.12);
    --blue:#3d91ff;
    --text:#e2eaf5;--muted:#4a6080;--subtle:#1e2d40;
    --mono:'JetBrains Mono','Fira Code',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden;}
  .app{display:flex;height:100vh;}
  /* Sidebar */
  .sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
  .sb-head{padding:14px;border-bottom:1px solid var(--border);}
  .logo{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .logo-name{font-size:15px;font-weight:600;}
  .badge{display:inline-flex;align-items:center;background:var(--accent-dim);border:1px solid var(--accent-mid);border-radius:20px;padding:3px 8px;font-size:10px;color:var(--accent);font-family:var(--mono);}
  .nav{padding:8px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);margin-bottom:2px;transition:all .15s;}
  .nav-item:hover{background:var(--card);color:var(--text);}
  .nav-item.active{background:var(--accent-dim);color:var(--accent);}
  .sb-foot{padding:10px;border-top:1px solid var(--border);}
  .model-pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:8px;}
  .model-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
  .signout{width:100%;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px;font-size:12px;cursor:pointer;}
  .signout:hover{color:var(--text);border-color:var(--text);}
  /* Main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0;}
  .topbar-title{font-size:14px;font-weight:500;}
  .chain-ok{font-size:11px;font-family:var(--mono);color:var(--accent);background:var(--accent-dim);padding:3px 8px;border-radius:6px;}
  /* Chat */
  .chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px;}
  .chat-body::-webkit-scrollbar{width:3px;}
  .chat-body::-webkit-scrollbar-thumb{background:var(--border);}
  .msg-row{display:flex;}
  .msg-row.user{justify-content:flex-end;}
  .msg{max-width:75%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;}
  .msg.user{background:var(--blue);color:#fff;border-bottom-right-radius:4px;}
  .msg.agent{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg.sys{background:var(--warn-dim);border:1px solid rgba(245,166,35,.3);border-radius:8px;max-width:90%;font-size:12px;}
  .msg.err{background:var(--red-dim);border:1px solid rgba(255,71,87,.3);border-radius:8px;max-width:90%;font-size:12px;}
  .typing{display:flex;gap:4px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px;width:fit-content;}
  .typing span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;padding:40px;gap:10px;}
  .empty p{font-size:13px;line-height:1.6;max-width:280px;}
  .chat-input{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;}
  .chat-input input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s;}
  .chat-input input:focus{border-color:var(--accent);}
  .chat-input input::placeholder{color:var(--muted);}
  .send-btn{width:38px;height:38px;border-radius:10px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .send-btn:disabled{opacity:.35;cursor:not-allowed;}
  /* Perm modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:340px;}
  .modal-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .modal-icon{width:36px;height:36px;border-radius:9px;background:var(--warn-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
  .modal-body{padding:14px 16px;}
  .checks{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
  .check-item{display:flex;gap:7px;font-size:12px;color:var(--muted);align-items:flex-start;}
  .modal-btns{display:flex;gap:8px;padding:0 16px 14px;}
  .btn{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);transition:all .15s;}
  .btn-allow{background:var(--accent);color:#080c10;border-color:var(--accent);}
  .btn-deny{background:transparent;color:var(--muted);}
  .btn-deny:hover{background:var(--card);color:var(--text);}
  /* Audit */
  .audit-body{flex:1;overflow-y:auto;}
  .audit-row{display:flex;gap:10px;padding:9px 18px;border-bottom:1px solid var(--border);align-items:flex-start;}
  .audit-row:hover{background:var(--card);}
  .audit-time{font-size:11px;font-family:var(--mono);color:var(--muted);min-width:50px;padding-top:2px;flex-shrink:0;}
  .evt{font-size:10px;padding:2px 6px;border-radius:5px;font-family:var(--mono);display:inline-block;margin-bottom:2px;}
  .evt-g{background:var(--accent-dim);color:var(--accent);}
  .evt-b{background:rgba(61,145,255,.12);color:var(--blue);}
  .evt-w{background:var(--warn-dim);color:var(--warn);}
  .evt-n{background:var(--subtle);color:var(--muted);}
  .audit-detail{font-size:12px;color:var(--text);font-family:var(--mono);}
  /* Settings */
  .settings-body{flex:1;overflow-y:auto;padding:18px;max-width:520px;}
  .s-section{margin-bottom:22px;}
  .s-label{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;font-family:var(--mono);}
  .s-card{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden;}
  .s-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
  .s-row:last-child{border-bottom:none;}
  .s-info p{font-size:13px;font-weight:500;margin:0 0 2px;}
  .s-info span{font-size:11px;color:var(--muted);}
  .toggle{width:36px;height:20px;border-radius:10px;background:var(--border);cursor:pointer;position:relative;border:none;flex-shrink:0;}
  .toggle.on{background:var(--accent);}
  .toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;}
  .toggle.on::after{left:19px;}
  .s-active{font-size:11px;background:var(--accent-dim);color:var(--accent);padding:3px 8px;border-radius:6px;font-family:var(--mono);}
  .revoke-btn{background:transparent;border:1px solid var(--border);color:var(--red);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;}
  /* Login */
  .login-page{display:flex;align-items:center;justify-content:center;height:100vh;}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px;width:320px;}
  .login-logo{text-align:center;margin-bottom:22px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-family:var(--mono);}
  .field input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s;}
  .field input:focus{border-color:var(--accent);}
  .login-btn{width:100%;background:var(--accent);color:#080c10;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}
  .login-btn:disabled{opacity:.5;cursor:not-allowed;}
  .err-box{font-size:12px;color:var(--red);background:var(--red-dim);border-radius:6px;padding:8px 10px;margin-top:8px;text-align:center;}
  .note-box{font-size:12px;color:var(--accent);background:var(--accent-dim);border-radius:6px;padding:8px 10px;margin-bottom:12px;}

  /* Calendar */
  .cal-body{flex:1;overflow-y:auto;padding:18px;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cal-title{font-size:14px;font-weight:500;}
  .cal-actions{display:flex;gap:8px;}
  .cal-btn{background:var(--accent);color:#080c10;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}
  .cal-btn-sec{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;}
  .cal-btn-sec:hover{color:var(--text);border-color:var(--text);}
  .event-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;}
  .event-date{background:var(--accent-dim);border:1px solid var(--accent-mid);border-radius:8px;padding:6px 10px;text-align:center;min-width:48px;flex-shrink:0;}
  .event-day{font-size:18px;font-weight:700;color:var(--accent);line-height:1;}
  .event-mon{font-size:10px;color:var(--accent);font-family:var(--mono);text-transform:uppercase;}
  .event-info{flex:1;}
  .event-title{font-size:13px;font-weight:500;margin-bottom:3px;}
  .event-meta{font-size:11px;color:var(--muted);}
  .no-cal{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:var(--muted);text-align:center;gap:10px;}
  .no-cal p{font-size:13px;max-width:260px;line-height:1.6;}
  /* Create event modal */
  .create-form{display:flex;flex-direction:column;gap:10px;padding:14px 16px;}
  .form-field{display:flex;flex-direction:column;gap:4px;}
  .form-label{font-size:11px;color:var(--muted);font-family:var(--mono);}
  .form-input{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--text);outline:none;}
  .form-input:focus{border-color:var(--accent);}
  /* Settings cal section */
  .provider-card{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
  .provider-card:last-child{border-bottom:none;}
  .provider-info p{font-size:13px;font-weight:500;margin:0 0 2px;}
  .provider-info span{font-size:11px;color:var(--muted);}
  .connect-btn{background:var(--accent);color:#080c10;border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .connected-badge{font-size:11px;background:var(--accent-dim);color:var(--accent);padding:3px 8px;border-radius:6px;font-family:var(--mono);}
  .setup-form{padding:10px 14px;background:var(--subtle);border-top:1px solid var(--border);}
  .setup-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--text);outline:none;margin-bottom:6px;font-family:var(--mono);}
  .setup-input:focus{border-color:var(--accent);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef,useCallback}=React;
const el=React.createElement;

// Token stored in memory — works in all browsers regardless of tracking prevention
let _tok=null, _usr='';

function getToken(){ return _tok; }
function setStoredToken(t,u){ _tok=t; _usr=u; try{sessionStorage.setItem('_bd_t',t);sessionStorage.setItem('_bd_u',u);}catch(e){} }
function clearToken(){ _tok=null; _usr=''; try{sessionStorage.clear();}catch(e){} }
// Try to restore from sessionStorage on page load
try{ const t=sessionStorage.getItem('_bd_t'); if(t){_tok=t; _usr=sessionStorage.getItem('_bd_u')||'';} }catch(e){}

async function api(path,opts={},token){
  const h={'Content-Type':'application/json'};
  if(token) h['Authorization']='Bearer '+token;
  const r=await fetch('http://localhost:8747'+path,{...opts,headers:h});
  if(!r.ok){
    let msg=r.statusText;
    try{ const e=await r.json(); msg=Array.isArray(e.detail)?e.detail.map(d=>d.msg).join(', '):(e.detail||msg); }catch(e){}
    throw new Error(msg);
  }
  return r.status===204?null:r.json();
}

// ── Icons ─────────────────────────────────────────────────────────────────────
const SVG=({d,size=16})=>el('svg',{width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},el('path',{d}));
const CHAT_ICON='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z';
const AUDIT_ICON='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z';
const SETTINGS_ICON='M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z';
const SEND_ICON='M22 2L11 13 M22 2L15 22 8 13 2 9z';
const CAL_ICON='M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z';

// ── Login ─────────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const[u,setU]=useState('');
  const[p,setP]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const[setup,setSetup]=useState(false);

  useEffect(()=>{
    api('/auth/setup-status').then(r=>setSetup(!r.setup_complete)).catch(()=>{});
  },[]);

  const submit=async()=>{
    if(!u||!p) return;
    setLoading(true); setErr('');
    try{
      const d=await api(setup?'/auth/setup':'/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
      setStoredToken(d.access_token,u);
      onLogin(d.access_token,u);
    }catch(e){ setErr(e.message); }
    setLoading(false);
  };

  return el('div',{className:'login-page'},
    el('div',{className:'login-box'},
      el('div',{className:'login-logo'},
        el('div',{className:'logo',style:{justifyContent:'center',marginBottom:6}},
          el('div',{className:'logo-dot'}),
          el('span',{className:'logo-name'},'BixDot')
        ),
        el('div',{style:{textAlign:'center'}},el('span',{className:'badge'},'LOCAL FIRST · NO CLOUD'))
      ),
      setup&&el('div',{className:'note-box'},'First run — create your owner account'),
      el('div',{className:'field'},el('label',null,'Username'),el('input',{value:u,onChange:e=>setU(e.target.value),placeholder:'username',autoFocus:true,onKeyDown:e=>e.key==='Enter'&&submit()})),
      el('div',{className:'field'},el('label',null,'Password'),el('input',{type:'password',value:p,onChange:e=>setP(e.target.value),placeholder:'••••••••••••',onKeyDown:e=>e.key==='Enter'&&submit()})),
      setup&&el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:8,lineHeight:1.5}},'Password needs: 12+ chars, uppercase, lowercase, number, special char (e.g. BixDot123!hello)'),
      el('button',{className:'login-btn',onClick:submit,disabled:loading},loading?'Please wait…':setup?'Create account':'Sign in'),
      err&&el('div',{className:'err-box'},err)
    )
  );
}

// ── Permission Modal ──────────────────────────────────────────────────────────
function PermModal({cap,onAllow,onDeny}){
  return el('div',{className:'modal-bg'},
    el('div',{className:'modal'},
      el('div',{className:'modal-h'},
        el('div',{className:'modal-icon'},'📁'),
        el('div',null,
          el('p',{style:{fontSize:14,fontWeight:500,marginBottom:2}},'Allow "'+cap+'"?'),
          el('p',{style:{fontSize:11,color:'var(--muted)'}},'BixDot · Built-in skill')
        )
      ),
      el('div',{className:'modal-body'},
        el('p',{style:{fontSize:12,color:'var(--muted)'}},'BixDot needs this to complete your request.'),
        el('div',{className:'checks'},
          el('div',{className:'check-item'},el('span',{style:{color:'var(--accent)'}},'>'),el('span',null,'Your data stays on this device')),
          el('div',{className:'check-item'},el('span',{style:{color:'var(--accent)'}},'>'),el('span',null,'Every access logged in audit log')),
          el('div',{className:'check-item'},el('span',{style:{color:'var(--accent)'}},'>'),el('span',null,'Revoke any time in Settings'))
        )
      ),
      el('div',{className:'modal-btns'},
        el('button',{className:'btn btn-deny',onClick:onDeny},"Don't allow"),
        el('button',{className:'btn btn-allow',onClick:onAllow},'Allow')
      )
    )
  );
}

// ── Chat ──────────────────────────────────────────────────────────────────────
function Chat({token}){
  const[msgs,setMsgs]=useState([]);
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const[sid,setSid]=useState(null);
  const[status,setStatus]=useState('Connecting...');
  const[pendingPerm,setPendingPerm]=useState(null);
  const[pendingMsg,setPendingMsg]=useState(null);
  const bottom=useRef(null);

  const addMsg=(role,text)=>setMsgs(m=>[...m,{role,text}]);

  const newSession=useCallback(async()=>{
    setStatus('Creating session...');
    setSid(null);
    try{
      const d=await api('/agent/sessions',{method:'POST',body:JSON.stringify({llm_backend:'ollama'})},token);
      setSid(d.session_id);
      setStatus('Ready · llama3.2 · local');
      return d.session_id;
    }catch(e){
      setStatus('Error: '+e.message);
      addMsg('err','Could not start session: '+e.message+'. Try refreshing the page.');
      return null;
    }
  },[token]);

  useEffect(()=>{ newSession(); },[newSession]);
  useEffect(()=>{ bottom.current?.scrollIntoView({behavior:'smooth'}); },[msgs,loading]);

  const send=async(text)=>{
    if(!text.trim()||loading) return;
    let sessionId=sid;
    if(!sessionId){
      addMsg('sys','Reconnecting...');
      sessionId=await newSession();
      if(!sessionId) return;
    }
    setInput('');
    addMsg('user',text);
    setLoading(true);
    setStatus('Thinking...');
    try{
      const r=await api('/agent/chat',{method:'POST',body:JSON.stringify({message:text,session_id:sessionId})},token);
      if(r.permissions_requested?.length>0){
        setPendingPerm(r.permissions_requested[0]);
        setPendingMsg(text);
        addMsg('sys','Permission needed: "'+r.permissions_requested[0]+'" — approve below.');
      }else{
        addMsg('agent',r.message||'(no response)');
      }
    }catch(e){
      addMsg('err','Error: '+e.message);
      if(e.message.includes('404')||e.message.includes('not found')){
        setSid(null);
        addMsg('sys','Session lost — will reconnect on next message.');
      }
    }
    setLoading(false);
    setStatus(sid?'Ready · llama3.2 · local':'Disconnected');
  };

  const allowPerm=async()=>{
    const cap=pendingPerm, msg=pendingMsg;
    setPendingPerm(null); setPendingMsg(null);
    await api('/agent/permissions/grant',{method:'POST',body:JSON.stringify({capability:cap,skill_id:'builtin'})},token).catch(()=>{});
    addMsg('sys','✓ "'+cap+'" granted. Retrying...');
    await send(msg);
  };

  const denyPerm=()=>{
    addMsg('agent',"Understood — I won't access that. What else can I help with?");
    setPendingPerm(null); setPendingMsg(null);
  };

  return el('div',{style:{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}},
    el('div',{style:{padding:'4px 18px',fontSize:11,color:'var(--muted)',borderBottom:'1px solid var(--border)',fontFamily:'var(--mono)'}},status),
    msgs.length===0&&el('div',{className:'empty'},
      el('div',{className:'logo-dot',style:{width:10,height:10}}),
      el('p',null,'BixDot is running on your device using Ollama. Your data never leaves this machine.'),
      el('p',{style:{fontSize:12}},'Try: "What can you do?" or "Hello!"')
    ),
    el('div',{className:'chat-body'},
      msgs.map((m,i)=>el('div',{key:i,className:'msg-row '+(m.role==='user'?'user':'')},
        el('div',{className:'msg '+(m.role==='err'?'err':m.role==='sys'?'sys':m.role)},m.text)
      )),
      loading&&el('div',{className:'msg-row'},
        el('div',{className:'typing'},el('span'),el('span'),el('span'))
      ),
      el('div',{ref:bottom})
    ),
    el('div',{className:'chat-input'},
      el('input',{
        value:input,
        onChange:e=>setInput(e.target.value),
        onKeyDown:e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(input); } },
        placeholder:loading?'BixDot is thinking…':'Ask BixDot anything…',
        disabled:loading,
        autoFocus:true
      }),
      el('button',{className:'send-btn',onClick:()=>send(input),disabled:loading||!input.trim()},
        el(SVG,{d:SEND_ICON,size:14})
      )
    ),
    pendingPerm&&el(PermModal,{cap:pendingPerm,onAllow:allowPerm,onDeny:denyPerm})
  );
}

// ── Audit ─────────────────────────────────────────────────────────────────────
function Audit({token}){
  const[logs,setLogs]=useState([]);
  const load=()=>api('/agent/audit?limit=50',{},token).then(setLogs).catch(()=>{});
  useEffect(()=>{ load(); const iv=setInterval(load,3000); return ()=>clearInterval(iv); },[token]);
  const cls=e=>e.includes('permission')?'evt-g':e.includes('file')||e.includes('data')?'evt-b':e.includes('auth')?'evt-w':'evt-n';
  return el('div',{className:'audit-body'},
    logs.length===0&&el('div',{className:'empty'},el('p',null,'No activity yet. Start chatting to see the audit log.')),
    logs.map((l,i)=>el('div',{key:i,className:'audit-row'},
      el('span',{className:'audit-time'},new Date(l.timestamp).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',second:'2-digit'})),
      el('div',null,
        el('span',{className:'evt '+cls(l.event)},l.event),
        el('div',{className:'audit-detail'},JSON.stringify(l.details).slice(0,90))
      )
    ))
  );
}


// ── Calendar Settings ─────────────────────────────────────────────────────────
function CalendarSettings({token}){
  const[status,setStatus]=useState(null);
  const[showGoogle,setShowGoogle]=useState(false);
  const[showIcal,setShowIcal]=useState(false);
  const[cid,setCid]=useState('');
  const[csec,setCsec]=useState('');
  const[icalPath,setIcalPath]=useState('');
  const[connecting,setConnecting]=useState(false);
  const[msg,setMsg]=useState('');

  const load=()=>api('/calendar/status',{},token).then(setStatus).catch(()=>{});
  useEffect(()=>load(),[token]);

  const connectGoogle=async()=>{
    if(!cid) return;
    setConnecting(true); setMsg('');
    try{
      const r=await api('/calendar/connect/google',{method:'POST',body:JSON.stringify({client_id:cid,client_secret:csec})},token);
      window.open(r.auth_url,'_blank');
      setMsg('Browser tab opened — sign in with Google, then come back and refresh.');
      setShowGoogle(false);
    }catch(e){ setMsg('Error: '+e.message); }
    setConnecting(false);
  };

  const connectIcal=async()=>{
    if(!icalPath) return;
    setConnecting(true); setMsg('');
    try{
      await api('/calendar/connect/ical',{method:'POST',body:JSON.stringify({file_path:icalPath})},token);
      setMsg('Local calendar file connected!');
      setShowIcal(false);
      load();
    }catch(e){ setMsg('Error: '+e.message); }
    setConnecting(false);
  };

  const disconnect=async(provider)=>{
    await api('/calendar/disconnect/'+provider,{method:'DELETE'},token).catch(()=>{});
    load();
  };

  if(!status) return el('div',{className:'s-card'},el('div',{className:'s-row'},el('span',{style:{fontSize:12,color:'var(--muted)'}},'Loading…')));

  const providers=status.providers||[];

  return el('div',{className:'s-card'},
    // Google Calendar row
    el('div',{className:'provider-card'},
      el('div',{className:'provider-info'},
        el('p',null,'Google Calendar'),
        el('span',null,providers.includes('google')?'Connected':'Not connected')
      ),
      providers.includes('google')
        ? el('button',{className:'revoke-btn',onClick:()=>disconnect('google')},'Disconnect')
        : el('button',{className:'connect-btn',onClick:()=>{ setShowGoogle(s=>!s); setShowIcal(false); }},'Connect')
    ),
    showGoogle&&el('div',{className:'setup-form'},
      el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:8,lineHeight:1.5}},'Enter your Google OAuth credentials. ',el('a',{href:'https://console.cloud.google.com',target:'_blank',style:{color:'var(--accent)'}},'Get them here'),' → Enable Calendar API → Create OAuth 2.0 credentials → Web app → Redirect: http://127.0.0.1:8747/calendar/oauth/callback'),
      el('input',{className:'setup-input',placeholder:'Client ID (ends with .apps.googleusercontent.com)',value:cid,onChange:e=>setCid(e.target.value)}),
      el('input',{className:'setup-input',placeholder:'Client Secret',type:'password',value:csec,onChange:e=>setCsec(e.target.value)}),
      el('button',{className:'connect-btn',onClick:connectGoogle,disabled:connecting||!cid},connecting?'Opening…':'Open Google sign-in')
    ),

    // Local .ics row
    el('div',{className:'provider-card'},
      el('div',{className:'provider-info'},
        el('p',null,'Local .ics file'),
        el('span',null,providers.includes('ical')?'Connected':'No auth needed')
      ),
      providers.includes('ical')
        ? el('button',{className:'revoke-btn',onClick:()=>disconnect('ical')},'Disconnect')
        : el('button',{className:'connect-btn',onClick:()=>{ setShowIcal(s=>!s); setShowGoogle(false); }},'Connect')
    ),
    showIcal&&el('div',{className:'setup-form'},
      el('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:8,lineHeight:1.5}},'Path to your .ics file. Export from Google Calendar (Settings → Export) or Outlook (File → Save Calendar).'),
      el('input',{className:'setup-input',placeholder:'C:\\Users\\you\\calendar.ics or ~/calendar.ics',value:icalPath,onChange:e=>setIcalPath(e.target.value)}),
      el('button',{className:'connect-btn',onClick:connectIcal,disabled:connecting||!icalPath},connecting?'Connecting…':'Connect file')
    ),

    msg&&el('div',{style:{padding:'8px 14px',fontSize:12,color:'var(--accent)',background:'var(--accent-dim)',borderTop:'1px solid var(--border)'}},msg)
  );
}

// ── Settings ──────────────────────────────────────────────────────────────────
function Settings({token}){
  const[cloud,setCloud]=useState(false);
  const[perms,setPerms]=useState([]);
  useEffect(()=>{ api('/agent/permissions',{},token).then(setPerms).catch(()=>{}); },[token]);
  const revoke=async cap=>{
    await api('/agent/permissions/'+cap,{method:'DELETE'},token).catch(()=>{});
    setPerms(p=>p.filter(x=>x.capability!==cap));
  };
  return el('div',{className:'settings-body'},
    el('div',{className:'s-section'},
      el('div',{className:'s-label'},'AI Model'),
      el('div',{className:'s-card'},
        el('div',{className:'s-row'},
          el('div',{className:'s-info'},el('p',null,'Local model (Ollama)'),el('span',null,'llama3.2 · on this device · no API key')),
          el('span',{className:'s-active'},'Active')
        ),
        el('div',{className:'s-row'},
          el('div',{className:'s-info'},el('p',null,'Cloud boost'),el('span',null,'Optional · your own API key required')),
          el('button',{className:'toggle'+(cloud?' on':''),onClick:()=>setCloud(c=>!c)})
        )
      )
    ),
    el('div',{className:'s-section'},
      el('div',{className:'s-label'},'Privacy'),
      el('div',{className:'s-card'},
        el('div',{className:'s-row'},el('div',{className:'s-info'},el('p',null,'Data storage'),el('span',null,'~/.bixdot/ · your device only')),el('span',{style:{color:'var(--muted)',fontSize:13}},'🔒')),
        el('div',{className:'s-row'},el('div',{className:'s-info'},el('p',null,'Audit log'),el('span',null,'Tamper-evident · always on')),el('button',{className:'toggle on',disabled:true}))
      )
    ),
    el('div',{className:'s-section'},
      el('div',{className:'s-label'},'Calendar'),
      el(CalendarSettings,{token}),
    ),
    el('div',{className:'s-section'},
      el('div',{className:'s-label'},'Active permissions ('+perms.length+')'),
      el('div',{className:'s-card'},
        perms.length===0&&el('div',{className:'s-row'},el('span',{style:{fontSize:13,color:'var(--muted)'}},'No active permissions')),
        perms.map((p,i)=>el('div',{key:i,className:'s-row'},
          el('div',{className:'s-info'},el('p',null,p.capability),el('span',null,'Granted '+new Date(p.granted_at).toLocaleTimeString())),
          el('button',{className:'revoke-btn',onClick:()=>revoke(p.capability)},'Revoke')
        ))
      )
    )
  );
}


// ── Calendar ──────────────────────────────────────────────────────────────────
function CreateEventModal({token, onClose, onCreated}){
  const[title,setTitle]=useState('');
  const[date,setDate]=useState(new Date().toISOString().split('T')[0]);
  const[time,setTime]=useState('09:00');
  const[duration,setDuration]=useState(60);
  const[desc,setDesc]=useState('');
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState('');

  const create=async()=>{
    if(!title||!date||!time) return;
    setLoading(true); setErr('');
    try{
      const r=await api('/calendar/events',{method:'POST',body:JSON.stringify({title,date,time,duration_minutes:parseInt(duration),description:desc})},token);
      onCreated(r);
    }catch(e){ setErr(e.message); }
    setLoading(false);
  };

  return el('div',{className:'modal-bg'},
    el('div',{className:'modal'},
      el('div',{className:'modal-h'},
        el('div',{className:'modal-icon'},'📅'),
        el('div',null,
          el('p',{style:{fontSize:14,fontWeight:500,marginBottom:2}},'New event'),
          el('p',{style:{fontSize:11,color:'var(--muted)'}},'Add to your calendar')
        )
      ),
      el('div',{className:'create-form'},
        el('div',{className:'form-field'},el('span',{className:'form-label'},'TITLE'),el('input',{className:'form-input',value:title,onChange:e=>setTitle(e.target.value),placeholder:'Meeting with team',autoFocus:true})),
        el('div',{style:{display:'flex',gap:8}},
          el('div',{className:'form-field',style:{flex:1}},el('span',{className:'form-label'},'DATE'),el('input',{className:'form-input',type:'date',value:date,onChange:e=>setDate(e.target.value)})),
          el('div',{className:'form-field',style:{flex:1}},el('span',{className:'form-label'},'TIME'),el('input',{className:'form-input',type:'time',value:time,onChange:e=>setTime(e.target.value)}))
        ),
        el('div',{className:'form-field'},el('span',{className:'form-label'},'DURATION (min)'),el('input',{className:'form-input',type:'number',value:duration,onChange:e=>setDuration(e.target.value),min:15,step:15})),
        el('div',{className:'form-field'},el('span',{className:'form-label'},'DESCRIPTION (optional)'),el('input',{className:'form-input',value:desc,onChange:e=>setDesc(e.target.value),placeholder:'Optional notes'})),
        err&&el('div',{style:{fontSize:12,color:'var(--red)',background:'var(--red-dim)',padding:'6px 8px',borderRadius:6}},err)
      ),
      el('div',{className:'modal-btns'},
        el('button',{className:'btn btn-deny',onClick:onClose},'Cancel'),
        el('button',{className:'btn btn-allow',onClick:create,disabled:loading||!title||!date||!time},loading?'Creating…':'Create event')
      )
    )
  );
}

function Calendar({token}){
  const[events,setEvents]=useState([]);
  const[loading,setLoading]=useState(true);
  const[err,setErr]=useState('');
  const[days,setDays]=useState(7);
  const[connected,setConnected]=useState(null);
  const[showCreate,setShowCreate]=useState(false);

  const loadStatus=()=>api('/calendar/status',{},token).then(r=>{setConnected(r);}).catch(()=>setConnected({connected:false,providers:[]}));
  const loadEvents=()=>{
    setLoading(true); setErr('');
    api('/calendar/events?days='+days,{},token)
      .then(r=>{ setEvents(r); setLoading(false); })
      .catch(e=>{ setErr(e.message); setLoading(false); });
  };

  useEffect(()=>{ loadStatus(); },[token]);
  useEffect(()=>{ if(connected&&connected.connected) loadEvents(); else setLoading(false); },[connected,days]);

  if(!connected) return el('div',{className:'cal-body'},el('div',{className:'empty'},el('p',null,'Checking calendar…')));

  if(!connected.connected) return el('div',{className:'cal-body'},
    el('div',{className:'no-cal'},
      el('div',{style:{fontSize:36,marginBottom:8}},'📅'),
      el('p',null,'No calendar connected yet.'),
      el('p',{style:{fontSize:12}},'Go to Settings → Calendar to connect Google Calendar or a local .ics file.'),
    )
  );

  const grouped={};
  events.forEach(e=>{
    const d=e.start.split('T')[0];
    if(!grouped[d]) grouped[d]=[];
    grouped[d].push(e);
  });

  return el('div',{className:'cal-body'},
    el('div',{className:'cal-header'},
      el('span',{className:'cal-title'},'Next '+days+' days · '+events.length+' event'+(events.length!==1?'s':'')),
      el('div',{className:'cal-actions'},
        el('select',{style:{background:'var(--card)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:7,padding:'5px 8px',fontSize:12,cursor:'pointer'},value:days,onChange:e=>setDays(parseInt(e.target.value))},
          el('option',{value:3},'3 days'),
          el('option',{value:7},'7 days'),
          el('option',{value:14},'14 days'),
          el('option',{value:30},'30 days')
        ),
        connected.active_provider==='google'&&el('button',{className:'cal-btn',onClick:()=>setShowCreate(true)},'+ New event'),
        el('button',{className:'cal-btn-sec',onClick:loadEvents},'Refresh')
      )
    ),
    loading&&el('div',{className:'empty'},el('p',null,'Loading events…')),
    err&&el('div',{style:{fontSize:12,color:'var(--red)',background:'var(--red-dim)',padding:'10px 12px',borderRadius:8,marginBottom:12}},err),
    !loading&&!err&&events.length===0&&el('div',{className:'no-cal'},el('p',null,'No events in the next '+days+' days. Enjoy the free time!')),
    Object.entries(grouped).map(([date,evts])=>el('div',{key:date},
      el('div',{style:{fontSize:11,color:'var(--muted)',fontFamily:'var(--mono)',marginBottom:6,marginTop:12}},
        new Date(date+'T12:00:00').toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'})
      ),
      evts.map(e=>el('div',{key:e.id,className:'event-card'},
        el('div',{className:'event-date'},
          el('div',{className:'event-day'},new Date(e.start).getDate()),
          el('div',{className:'event-mon'},new Date(e.start).toLocaleDateString('en',{month:'short'}))
        ),
        el('div',{className:'event-info'},
          el('div',{className:'event-title'},e.title),
          el('div',{className:'event-meta'},
            e.all_day?'All day':
            new Date(e.start).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})+
            ' – '+new Date(e.end).toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}),
            e.location&&' · 📍 '+e.location
          )
        )
      ))
    )),
    showCreate&&el(CreateEventModal,{token,onClose:()=>setShowCreate(false),onCreated:(evt)=>{ setShowCreate(false); setEvents(evs=>[...evs,evt].sort((a,b)=>a.start.localeCompare(b.start))); }})
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[token,setToken]=useState(_tok);
  const[username,setUsername]=useState(_usr);
  const[screen,setScreen]=useState('chat');

  const login=(t,u)=>{ setToken(t); setUsername(u); };
  const logout=()=>{ clearToken(); setToken(null); setUsername(''); };

  if(!token) return el(Login,{onLogin:login});

  const nav=[
    {id:'chat',label:'Chat',icon:CHAT_ICON},
    {id:'calendar',label:'Calendar',icon:CAL_ICON},
    {id:'audit',label:'Audit log',icon:AUDIT_ICON},
    {id:'settings',label:'Settings',icon:SETTINGS_ICON},
  ];

  return el('div',{className:'app'},
    el('div',{className:'sidebar'},
      el('div',{className:'sb-head'},
        el('div',{className:'logo'},el('div',{className:'logo-dot'}),el('span',{className:'logo-name'},'BixDot')),
        el('span',{className:'badge'},'LOCAL · OFFLINE')
      ),
      el('nav',{className:'nav'},
        nav.map(n=>el('div',{key:n.id,className:'nav-item'+(screen===n.id?' active':''),onClick:()=>setScreen(n.id)},
          el(SVG,{d:n.icon}),el('span',null,n.label)
        ))
      ),
      el('div',{className:'sb-foot'},
        el('div',{className:'model-pill'},el('div',{className:'model-dot'}),el('span',{style:{fontSize:11,fontFamily:'var(--mono)',color:'var(--muted)'}},'llama3.2 · local')),
        el('button',{className:'signout',onClick:logout},'Sign out ('+username+')')
      )
    ),
    el('div',{className:'main'},
      el('div',{className:'topbar'},
        el('span',{className:'topbar-title'},nav.find(n=>n.id===screen)?.label),
        el('span',{className:'chain-ok'},'✓ Chain verified · Local')
      ),
      screen==='chat'&&el(Chat,{token}),
      screen==='calendar'&&el(Calendar,{token}),
      screen==='audit'&&el(Audit,{token}),
      screen==='settings'&&el(Settings,{token})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(el(App));
</script>
