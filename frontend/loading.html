<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>BixDot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#080c10;
  color:#e2eaf5;
  display:flex;align-items:center;justify-content:center;
  height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  user-select:none;
  -webkit-user-select:none;
}
.wrap{text-align:center;}
.dot{
  width:16px;height:16px;border-radius:50%;
  background:#00d4aa;
  box-shadow:0 0 20px rgba(0,212,170,.65);
  margin:0 auto 28px;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1;}
  50%{transform:scale(.55);opacity:.3;}
}
h1{font-size:26px;font-weight:600;letter-spacing:-.4px;margin-bottom:6px;}
p{font-size:12px;color:#3d5570;letter-spacing:.05em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="dot"></div>
  <h1>BixDot</h1>
  <p>Starting local AI agent…</p>
</div>
</body>
</html>
