# BXD-003 — this job is ADVISORY-PLUS-PR. It is never the author of record.
#
# Governing rule (docs/governance/03_GOVERNANCE.md section 2):
#     "No automation pushes to main. Bots open pull requests."
#
# Enforced here by construction:
#   - lint is REPORTED, never auto-applied to product code
#   - the full test suite runs BEFORE anything is committed
#   - dependency bumps land on security/audit-YYYY-MM-DD and open a PR
#   - an unresolved CVE fails the job (no `|| true`)
#
# Enforced in repository settings (cannot be expressed in this file):
#   - branch protection on main: require PR + status checks, block force push,
#     no bypass for Actions or admins.
#
# tests/test_workflow_audit.py asserts every one of the properties above.

name: Daily Security Audit

on:
  schedule:
    # 22:00 UTC = 06:00 SGT (UTC+8), every day
    - cron: "0 22 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

permissions:
  # contents: write is the minimum that can create a commit — no token scope
  # allows a pull request without it. The control is scope, not absence: this
  # job pushes ONLY to a security/audit-* branch and never to main, and branch
  # protection on main is what mechanically enforces that. Never widen this.
  contents: write
  pull-requests: write

jobs:
  audit:
    name: CVE · Bandit · Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: pinned to 3.12 to match ci.yml. release.yml still builds on 3.11 —
      # unifying all three onto one declared version is BXD-008 (Phase 2).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install audit + lint tools
        run: |
          pip install --upgrade pip
          pip install pip-audit bandit ruff

      - name: Install project dependencies
        # requirements-dev.txt supplies pytest — the suite gates every commit.
        run: pip install -r requirements.txt -r requirements-dev.txt

      # ── 1. CVE Audit ────────────────────────────────────────────────────────
      - name: pip-audit — check for CVEs
        id: pip_audit
        run: |
          set +e
          pip-audit -r requirements.txt -f json -o pip-audit-report.json
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            echo "cve_found=true" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ CVEs Found" >> "$GITHUB_STEP_SUMMARY"
            cat pip-audit-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for dep in data.get('dependencies', []):
              for v in dep.get('vulns', []):
                  print(f\"| {dep['name']} {dep['version']} | {v['id']} | {v['fix_versions']} | {v['description'][:80]} |\")
          " >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "cve_found=false" >> "$GITHUB_OUTPUT"
            echo "### ✅ CVE Audit — Clean" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: pip-audit — auto-bump vulnerable packages
        if: steps.pip_audit.outputs.cve_found == 'true'
        run: |
          # Preview only — informational, never gates.
          pip-audit -r requirements.txt --fix --dry-run 2>&1 || true

          # The real fix. NOT wrapped in `|| true`: if pip-audit cannot resolve a
          # CVE, this step fails and the job fails with it (BXD-003 / BXD-015).
          # A green run must mean "clean", not "we tried".
          pip-audit -r requirements.txt --fix

          # Sync requirements.txt with what was actually upgraded
          pip freeze | grep -F -f <(grep -v '^#' requirements.txt | sed 's/[>=<].*//' | tr '[:upper:]' '[:lower:]') \
            > requirements-new.txt || true

          # Only replace if the freeze produced valid output
          if [ -s requirements-new.txt ]; then
            # Preserve comment lines from original requirements.txt
            python3 - <<'EOF'
          import re, pathlib

          orig = pathlib.Path("requirements.txt").read_text()
          new_versions = {}
          for line in pathlib.Path("requirements-new.txt").read_text().splitlines():
              if "==" in line:
                  pkg, ver = line.split("==", 1)
                  new_versions[pkg.lower()] = ver.strip()

          out = []
          for line in orig.splitlines():
              stripped = line.strip()
              if stripped.startswith("#") or not stripped:
                  out.append(line)
                  continue
              pkg = re.split(r"[>=<!]", stripped)[0].lower()
              if pkg in new_versions:
                  # keep original specifier style but bump the version
                  out.append(re.sub(r"(>=|==|~=)[\d.]+", lambda m: m.group(1) + new_versions[pkg], line))
              else:
                  out.append(line)
          pathlib.Path("requirements.txt").write_text("\n".join(out) + "\n")
          EOF
            echo "requirements.txt updated with safe package versions"
          fi
          rm -f requirements-new.txt

      # ── 2. Bandit Security Scan ─────────────────────────────────────────────
      - name: bandit — HIGH severity scan
        id: bandit
        run: |
          set +e
          bandit -r core/ -ll -ii --skip B101,B603,B607 -f json -o bandit-report.json
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            echo "bandit_issues=true" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ Bandit — HIGH Severity Issues Found" >> "$GITHUB_STEP_SUMMARY"
            echo "Manual review required — see bandit-report.json artifact" >> "$GITHUB_STEP_SUMMARY"
            cat bandit-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for r in data.get('results', []):
              print(f\"- [{r['issue_severity']}] {r['filename']}:{r['line_number']} — {r['issue_text']}\")
          " >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "bandit_issues=false" >> "$GITHUB_OUTPUT"
            echo "### ✅ Bandit — No HIGH Severity Issues" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bandit report
        if: steps.bandit.outputs.bandit_issues == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      # ── 3. Ruff Lint — REPORT ONLY ──────────────────────────────────────────
      # BXD-003: `ruff --fix` used to run here and its output was committed to
      # main unreviewed. `--fix` is not always semantically neutral (removing an
      # "unused" import removes its side effects), and this job has no way to
      # tell a safe rewrite from a breaking one. Lint findings are reported to
      # the job summary for a human. This job never edits core/.
      - name: ruff — report lint issues (core/ and full repo)
        id: ruff
        run: |
          for SCOPE in "core/" "."; do
            REMAINING=$(ruff check "$SCOPE" 2>&1 || true)
            if [ -n "$REMAINING" ]; then
              echo "### ⚠️ Ruff — issues in '$SCOPE' (manual fix required)" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
              echo "$REMAINING" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### ✅ Ruff — no lint issues in '$SCOPE'" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # ── 4. Test gate — no green tests, no PR ────────────────────────────────
      # A dependency floor bump IS a code change. Nothing this job produces may
      # be proposed without the suite passing against it first.
      - name: pytest — full suite must pass before anything is proposed
        run: pytest tests/ -q

      # ── 5. Open a pull request (never a push to main) ────────────────────────
      - name: Open pull request with dependency fixes
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "BixDot Security Bot"
          git config user.email "security@bixdot.app"

          # Dependency manifests only. This job does not author product code —
          # core/, tests/, scripts/ and docs/ are deliberately NOT staged.
          git add requirements.txt pyproject.toml

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "### ℹ️ No dependency changes — nothing to propose" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          BRANCH="security/audit-$DATE"
          git switch -c "$BRANCH"
          git commit -m "security: daily audit $DATE — dependency CVE bump"
          git push -u origin "$BRANCH" --force-with-lease

          {
            echo "Automated dependency bump from the nightly security audit."
            echo
            echo "- CVEs found: \`${{ steps.pip_audit.outputs.cve_found }}\`"
            echo "- Full test suite passed before this PR was opened."
            echo "- Lint was reported only; this job does not edit \`core/\`."
            echo
            echo "Review the dependency diff and the run summary before merging."
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "security: audit $DATE" \
            --body-file pr-body.md

          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "### ✅ Pull request opened from \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      # ── 6. Fail job if HIGH bandit issues remain (triggers email alert) ─────
      - name: Fail if HIGH severity issues found (triggers GitHub notification)
        if: steps.bandit.outputs.bandit_issues == 'true'
        run: |
          echo "::error::Bandit found HIGH severity security issues in core/. See the bandit-report artifact and the job summary for details. Manual fix required."
          exit 1
