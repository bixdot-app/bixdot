# BXD-003 — this job is ADVISORY-PLUS-PR. It is never the author of record.
#
# Governing rule (docs/governance/03_GOVERNANCE.md section 2):
#     "No automation pushes to main. Bots open pull requests."
#
# Enforced here by construction:
#   - lint is REPORTED, never auto-applied to product code
#   - the full test suite runs BEFORE anything is committed
#   - dependency bumps land on security/audit-YYYY-MM-DD and open a PR
#   - an unresolved CVE fails the job (no `|| true`, and re-verified explicitly
#     after the --fix attempt — BXD-015)
#
# Enforced in repository settings (cannot be expressed in this file):
#   - branch protection on main: require PR + status checks, block force push,
#     no bypass for Actions or admins.
#
# tests/test_workflow_audit.py asserts every one of the properties above.
#
# BXD-015 — two structural risks in a schedule-triggered job, neither fixable
# by better bash:
#   1. GitHub disables `schedule` triggers after 60 days with no repository
#      activity. This repo's own commits/PRs keep it active today, but that is
#      incidental, not a control — nothing in this file can detect or prevent
#      the schedule being silently disabled. If the daily run summary and the
#      tracking-issue comment below both go quiet, check
#      Settings → Actions → this workflow for "disabled_inactivity" first.
#   2. A green run has historically meant "the one condition we bothered to
#      check passed" (bandit HIGH), not "clean". The notification step at the
#      end of this job runs on every trigger, pass or fail, specifically so a
#      human has a durable record even when nothing fails.

name: Daily Security Audit

on:
  schedule:
    # 22:00 UTC = 06:00 SGT (UTC+8), every day
    - cron: "0 22 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

permissions:
  # contents: write is the minimum that can create a commit — no token scope
  # allows a pull request without it. The control is scope, not absence: this
  # job pushes ONLY to a security/audit-* branch and never to main, and branch
  # protection on main is what mechanically enforces that. Never widen this.
  contents: write
  pull-requests: write
  # issues: write is for the always-on notification step only (BXD-015) — it
  # comments on a running tracking issue so a clean run leaves a visible,
  # non-failure-dependent record, not just a step summary nobody opens.
  issues: write

jobs:
  audit:
    name: CVE · Bandit · Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # BXD-008: one Python version, declared once in .python-version and
      # referenced here, in ci.yml, and in release.yml. Before this fix, CI and
      # this audit ran 3.12 while release.yml built 3.11 — CVEs and dependency
      # floors were validated on an interpreter the product does not ship.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install audit + lint tools
        run: |
          pip install --upgrade pip
          pip install pip-audit bandit ruff

      - name: Install project dependencies
        # requirements-dev.txt supplies pytest — the suite gates every commit.
        run: pip install -r requirements.txt -r requirements-dev.txt

      # ── 1. CVE Audit ────────────────────────────────────────────────────────
      - name: pip-audit — check for CVEs
        id: pip_audit
        run: |
          set +e
          pip-audit -r requirements.txt -f json -o pip-audit-report.json
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            echo "cve_found=true" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ CVEs Found" >> "$GITHUB_STEP_SUMMARY"
            cat pip-audit-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for dep in data.get('dependencies', []):
              for v in dep.get('vulns', []):
                  print(f\"| {dep['name']} {dep['version']} | {v['id']} | {v['fix_versions']} | {v['description'][:80]} |\")
          " >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "cve_found=false" >> "$GITHUB_OUTPUT"
            echo "### ✅ CVE Audit — Clean" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: pip-audit — auto-bump vulnerable packages
        if: steps.pip_audit.outputs.cve_found == 'true'
        run: |
          # Preview only — informational, never gates.
          pip-audit -r requirements.txt --fix --dry-run 2>&1 || true

          # The real fix. NOT wrapped in `|| true`: if pip-audit cannot resolve a
          # CVE, this step fails and the job fails with it (BXD-003 / BXD-015).
          # A green run must mean "clean", not "we tried".
          pip-audit -r requirements.txt --fix

          # Sync requirements.txt with what was actually upgraded
          pip freeze | grep -F -f <(grep -v '^#' requirements.txt | sed 's/[>=<].*//' | tr '[:upper:]' '[:lower:]') \
            > requirements-new.txt || true

          # Only replace if the freeze produced valid output
          if [ -s requirements-new.txt ]; then
            # Preserve comment lines from original requirements.txt
            python3 - <<'EOF'
          import re, pathlib

          orig = pathlib.Path("requirements.txt").read_text()
          new_versions = {}
          for line in pathlib.Path("requirements-new.txt").read_text().splitlines():
              if "==" in line:
                  pkg, ver = line.split("==", 1)
                  new_versions[pkg.lower()] = ver.strip()

          out = []
          for line in orig.splitlines():
              stripped = line.strip()
              if stripped.startswith("#") or not stripped:
                  out.append(line)
                  continue
              pkg = re.split(r"[>=<!]", stripped)[0].lower()
              if pkg in new_versions:
                  # keep original specifier style but bump the version
                  out.append(re.sub(r"(>=|==|~=)[\d.]+", lambda m: m.group(1) + new_versions[pkg], line))
              else:
                  out.append(line)
          pathlib.Path("requirements.txt").write_text("\n".join(out) + "\n")
          EOF
            echo "requirements.txt updated with safe package versions"
          fi
          rm -f requirements-new.txt

      # ── 1.5 Verify — an unresolved CVE must fail this job, unconditionally ──
      # BXD-015: `--fix` above is not proof; it is an attempt. This step
      # re-runs pip-audit against whatever requirements.txt looks like now
      # (fixed, partially fixed, or untouched) and is the single source of
      # truth for "unresolved_cve" — nothing downstream may swallow this.
      # Runs every time, not just when step 1 found something, so a CVE class
      # pip-audit only detects on a second pass is not missed either.
      - name: pip-audit — verify no unresolved CVEs remain
        id: pip_audit_verify
        run: |
          set +e
          pip-audit -r requirements.txt
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            echo "unresolved=true" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ Unresolved CVEs remain after the fix attempt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "unresolved=false" >> "$GITHUB_OUTPUT"
            echo "### ✅ pip-audit — clean after fix attempt" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 2. Bandit Security Scan ─────────────────────────────────────────────
      - name: bandit — HIGH severity scan
        id: bandit
        run: |
          set +e
          bandit -r core/ -ll -ii --skip B101,B603,B607 -f json -o bandit-report.json
          EXIT=$?
          set -e

          if [ $EXIT -ne 0 ]; then
            echo "bandit_issues=true" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ Bandit — HIGH Severity Issues Found" >> "$GITHUB_STEP_SUMMARY"
            echo "Manual review required — see bandit-report.json artifact" >> "$GITHUB_STEP_SUMMARY"
            cat bandit-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for r in data.get('results', []):
              print(f\"- [{r['issue_severity']}] {r['filename']}:{r['line_number']} — {r['issue_text']}\")
          " >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "bandit_issues=false" >> "$GITHUB_OUTPUT"
            echo "### ✅ Bandit — No HIGH Severity Issues" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bandit report
        if: steps.bandit.outputs.bandit_issues == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      # ── 3. Ruff Lint — REPORT ONLY ──────────────────────────────────────────
      # BXD-003: `ruff --fix` used to run here and its output was committed to
      # main unreviewed. `--fix` is not always semantically neutral (removing an
      # "unused" import removes its side effects), and this job has no way to
      # tell a safe rewrite from a breaking one. Lint findings are reported to
      # the job summary for a human. This job never edits core/.
      - name: ruff — report lint issues (core/ and full repo)
        id: ruff
        run: |
          for SCOPE in "core/" "."; do
            REMAINING=$(ruff check "$SCOPE" 2>&1 || true)
            if [ -n "$REMAINING" ]; then
              echo "### ⚠️ Ruff — issues in '$SCOPE' (manual fix required)" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
              echo "$REMAINING" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### ✅ Ruff — no lint issues in '$SCOPE'" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # ── 4. Test gate — no green tests, no PR ────────────────────────────────
      # A dependency floor bump IS a code change. Nothing this job produces may
      # be proposed without the suite passing against it first.
      - name: pytest — full suite must pass before anything is proposed
        run: pytest tests/ -q

      # ── 4.5 Licence gate — no pass, no PR (BXD-005) ─────────────────────────
      # A dependency bump can introduce a new transitive package with a
      # licence outside docs/governance/03_GOVERNANCE.md section 4 just as
      # easily as it can introduce a CVE. This is the same gate ci.yml runs
      # on every PR, run again here so a bad licence never even reaches a PR.
      # BXD-029: this job's shared environment also has requirements-dev.txt
      # installed (pytest needs it, above), which pulls in semgrep and
      # pyinstaller — correctly dev-only, GPL/LGPL-licensed tools that never
      # ship (see requirements-dev.txt's own comments) — plus their
      # transitive deps (face, peewee, ...). check_licenses.py inspects
      # whatever is installed against sys.executable, so running it here
      # against the shared job environment fails the SAME production gate
      # ci.yml passes, on packages that never reach a build. Install
      # requirements.txt into a throwaway venv instead — this mirrors
      # ci.yml's licenses-python job, which only ever installs
      # requirements.txt before running this gate.
      - name: Licence gate — pip (isolated venv, requirements.txt only)
        run: |
          python -m venv /tmp/licence-gate-venv
          /tmp/licence-gate-venv/bin/pip install --upgrade pip
          /tmp/licence-gate-venv/bin/pip install -r requirements.txt pip-licenses
          /tmp/licence-gate-venv/bin/python scripts/check_licenses.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-deny binary
        id: cache-cargo-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-bin-${{ runner.os }}-v0.20

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked

      # BXD-006: the Rust/Tauri tree was never scanned at all before this.
      # Reviewed exceptions and ignored advisories live in src-tauri/deny.toml
      # (see docs/governance/LICENCE_ALLOWLIST.md and BXD-019).
      - name: Licence + advisory gate — cargo
        working-directory: src-tauri
        run: cargo deny check advisories licenses

      # ── 5. Open a pull request (never a push to main) ────────────────────────
      - name: Open pull request with dependency fixes
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "BixDot Security Bot"
          git config user.email "security@bixdot.app"

          # Dependency manifests only. This job does not author product code —
          # core/, tests/, scripts/ and docs/ are deliberately NOT staged.
          git add requirements.txt pyproject.toml

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "### ℹ️ No dependency changes — nothing to propose" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          BRANCH="security/audit-$DATE"
          git switch -c "$BRANCH"
          git commit -m "security: daily audit $DATE — dependency CVE bump"
          git push -u origin "$BRANCH" --force-with-lease

          {
            echo "Automated dependency bump from the nightly security audit."
            echo
            echo "- CVEs found: \`${{ steps.pip_audit.outputs.cve_found }}\`"
            echo "- Full test suite passed before this PR was opened."
            echo "- Lint was reported only; this job does not edit \`core/\`."
            echo
            echo "Review the dependency diff and the run summary before merging."
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "security: audit $DATE" \
            --body-file pr-body.md

          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "### ✅ Pull request opened from \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      # ── 6. Fail job if HIGH bandit issues remain (triggers email alert) ─────
      - name: Fail if HIGH severity issues found (triggers GitHub notification)
        if: steps.bandit.outputs.bandit_issues == 'true'
        run: |
          echo "::error::Bandit found HIGH severity security issues in core/. See the bandit-report artifact and the job summary for details. Manual fix required."
          exit 1

      # ── 7. Fail job if a CVE remains unresolved (triggers email alert) ──────
      # BXD-015: this used to be the ONLY thing missing — `--fix` failing was
      # already ungated (not wrapped in `|| true`), but nothing re-verified
      # the end state, so a partially-fixed requirements.txt with pip-audit
      # `--fix`'s own exit code masked by an intervening step could still
      # produce a green run. This step is the explicit, unambiguous gate.
      - name: Fail if unresolved CVEs remain (triggers GitHub notification)
        if: steps.pip_audit_verify.outputs.unresolved == 'true'
        run: |
          echo "::error::pip-audit found CVEs in requirements.txt that --fix could not resolve. A passing run must mean clean, not 'we tried'. See the PR (if opened) and the job summary."
          exit 1

      # ── 8. Notify — always, independent of pass or fail ─────────────────────
      # BXD-015: GitHub's built-in failure email only fires when the job
      # fails, and a disabled schedule (see the file header) produces no
      # signal at all — not even a failure. This step runs on every trigger
      # via `if: always()` and posts to a running tracking issue, so there is
      # a human-visible heartbeat regardless of outcome. Best-effort: a
      # failure here must never fail the overall workflow run.
      - name: Notify — post today's result to the tracking issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          DATE=$(date +%Y-%m-%d)
          STATUS="✅ clean"
          [ "${{ steps.pip_audit_verify.outputs.unresolved }}" = "true" ] && STATUS="⚠️ unresolved CVE"
          [ "${{ steps.bandit.outputs.bandit_issues }}" = "true" ] && STATUS="$STATUS · ⚠️ bandit HIGH"
          [ "${{ steps.pr.outputs.committed }}" = "true" ] && STATUS="$STATUS · 🔧 PR opened"

          TITLE="Nightly Security Audit Log"
          ISSUE_NUMBER=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_URL=$(gh issue create --repo "$REPO" --title "$TITLE" \
              --body "Running log of \`daily-security-audit.yml\` results — one comment per run, newest at the bottom. If this issue stops receiving comments, the schedule may have been disabled after 60 days of repository inactivity (see the workflow file header).")
            ISSUE_NUMBER=${ISSUE_URL##*/}
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "**$DATE** — $STATUS — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
