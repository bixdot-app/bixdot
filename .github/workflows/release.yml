name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0" --locked

      # ── Generate macOS .icns from PNGs (macOS runner has iconutil built in) ──
      - name: Generate macOS icon
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/icons/icon.iconset
          cp src-tauri/icons/32x32.png   src-tauri/icons/icon.iconset/icon_32x32.png
          cp src-tauri/icons/64x64.png   src-tauri/icons/icon.iconset/icon_32x32@2x.png
          cp src-tauri/icons/128x128.png src-tauri/icons/icon.iconset/icon_128x128.png
          cp src-tauri/icons/256x256.png src-tauri/icons/icon.iconset/icon_128x128@2x.png
          cp src-tauri/icons/256x256.png src-tauri/icons/icon.iconset/icon_256x256.png
          cp src-tauri/icons/512x512.png src-tauri/icons/icon.iconset/icon_256x256@2x.png
          cp src-tauri/icons/512x512.png src-tauri/icons/icon.iconset/icon_512x512.png
          iconutil -c icns src-tauri/icons/icon.iconset -o src-tauri/icons/icon.icns
          echo "✅ icon.icns generated"
          ls -lh src-tauri/icons/icon.icns

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Tauri app
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/**/*"
          draft: true
          prerelease: false
          name: "BixDot ${{ github.ref_name }}"
          tag: ${{ github.ref_name }}
          body: |
            ## BixDot ${{ github.ref_name }} — Local AI Agent

            Your AI agent. Your device. Your data. No cloud required.

            ---

            ### Download

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows  | `BixDot_x64-setup.exe` | Recommended |
            | Windows  | `BixDot_x64_en-US.msi` | MSI alternative |
            | Mac (Apple Silicon) | `BixDot_aarch64.dmg` | M1/M2/M3 |
            | Mac (Intel) | `BixDot_x64.dmg` | Intel Macs |
            | Linux | `BixDot_amd64.AppImage` | Universal |
            | Linux | `BixDot_amd64.deb` | Debian/Ubuntu |

            ---

            ### Requirements (installed separately)
            1. **Python 3.11+** — https://python.org/downloads
            2. **Ollama** — https://ollama.ai
            3. **llama3.2 model** — run `ollama pull llama3.2` after installing Ollama

            BixDot will guide you through setup on first launch.

            ---

            ### What's new
            See [CHANGELOG.md](https://github.com/bixdot-app/bixdot/blob/main/CHANGELOG.md)

