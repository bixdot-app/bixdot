name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    # Auto-updater signing (v0.5): when these secrets are set, builds also
    # produce signed updater artifacts and releases include latest.json.
    # Without them, builds are identical to before — nothing breaks.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # PyInstaller lives in requirements-dev.txt (GPL-with-exception build
      # tool — never in the production manifest). Installed standalone here
      # with the same constraint: the full dev manifest pulls semgrep, which
      # does not reliably install on the Windows/macOS release runners.
      - name: Build PyInstaller backend bundle
        run: |
          pip install "pyinstaller>=6.0.0"
          pyinstaller bixdot.spec --distpath dist-backend --workpath build-backend

      # Tauri externalBin requires the binary to exist with the target triple
      # suffix at build time. Rename the PyInstaller output accordingly.
      - name: Rename backend to target-triple name (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Move-Item dist-backend/bixdot-backend.exe dist-backend/bixdot-backend-x86_64-pc-windows-msvc.exe

      - name: Rename backend to target-triple name (macOS aarch64)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        run: |
          mv dist-backend/bixdot-backend dist-backend/bixdot-backend-aarch64-apple-darwin
          chmod +x dist-backend/bixdot-backend-aarch64-apple-darwin

      - name: Rename backend to target-triple name (macOS x86_64)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        run: |
          mv dist-backend/bixdot-backend dist-backend/bixdot-backend-x86_64-apple-darwin
          chmod +x dist-backend/bixdot-backend-x86_64-apple-darwin

      - name: Rename backend to target-triple name (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mv dist-backend/bixdot-backend dist-backend/bixdot-backend-x86_64-unknown-linux-gnu
          chmod +x dist-backend/bixdot-backend-x86_64-unknown-linux-gnu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0"

      - name: Generate macOS icon
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/icons/icon.iconset
          cp src-tauri/icons/32x32.png   src-tauri/icons/icon.iconset/icon_32x32.png
          cp src-tauri/icons/64x64.png   src-tauri/icons/icon.iconset/icon_32x32@2x.png
          cp src-tauri/icons/128x128.png src-tauri/icons/icon.iconset/icon_128x128.png
          cp src-tauri/icons/256x256.png src-tauri/icons/icon.iconset/icon_128x128@2x.png
          cp src-tauri/icons/256x256.png src-tauri/icons/icon.iconset/icon_256x256.png
          cp src-tauri/icons/512x512.png src-tauri/icons/icon.iconset/icon_256x256@2x.png
          cp src-tauri/icons/512x512.png src-tauri/icons/icon.iconset/icon_512x512.png
          iconutil -c icns src-tauri/icons/icon.iconset -o src-tauri/icons/icon.icns

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Tauri app (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          ICONS='"icon":["icons/32x32.png","icons/128x128.png","icons/256x256.png","icons/512x512.png","icons/icon.ico","icons/icon.icns"]'
          CONFIG="{\"bundle\":{$ICONS}}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            CONFIG="{\"bundle\":{\"createUpdaterArtifacts\":true,$ICONS}}"
          fi
          cargo tauri build ${{ matrix.args }} --config "$CONFIG"

      - name: Build Tauri app (Windows + Linux)
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: |
          EXTRA=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA='--config {"bundle":{"createUpdaterArtifacts":true}}'
          fi
          cargo tauri build ${{ matrix.args }} $EXTRA

      # ── Find and copy all installers to a flat staging folder ──────────────
      - name: Stage installers (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Get-ChildItem -Recurse src-tauri/target/x86_64-pc-windows-msvc/release/bundle `
            -Include *.exe,*.msi,*.sig | Copy-Item -Destination staging/
          Get-ChildItem staging/

      - name: Stage installers (macOS aarch64)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        run: |
          mkdir -p staging
          find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.dmg" -exec cp {} staging/ \;
          # Updater artifacts (only exist when signing is configured) — rename
          # per-arch to avoid collisions when artifacts are merged.
          find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app.tar.gz" \
            -exec cp {} staging/BixDot_aarch64.app.tar.gz \; || true
          find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app.tar.gz.sig" \
            -exec cp {} staging/BixDot_aarch64.app.tar.gz.sig \; || true
          ls staging/

      - name: Stage installers (macOS x86_64)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        run: |
          mkdir -p staging
          find src-tauri/target/x86_64-apple-darwin/release/bundle -name "*.dmg" -exec cp {} staging/ \;
          find src-tauri/target/x86_64-apple-darwin/release/bundle -name "*.app.tar.gz" \
            -exec cp {} staging/BixDot_x64.app.tar.gz \; || true
          find src-tauri/target/x86_64-apple-darwin/release/bundle -name "*.app.tar.gz.sig" \
            -exec cp {} staging/BixDot_x64.app.tar.gz.sig \; || true
          ls staging/

      - name: Stage installers (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p staging
          find src-tauri/target/release/bundle -name "*.deb" -exec cp {} staging/ \;
          find src-tauri/target/release/bundle -name "*.AppImage" -exec cp {} staging/ \;
          find src-tauri/target/release/bundle -name "*.AppImage.sig" -exec cp {} staging/ \; || true
          ls staging/

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ strategy.job-index }}
          path: staging/*
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List installers
        run: find installers -type f | sort

      # Auto-updater manifest (v0.5): built only when signed updater artifacts
      # exist (i.e. TAURI_SIGNING_PRIVATE_KEY was configured for the build).
      - name: Generate latest.json for the auto-updater
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, datetime

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          d = "installers"
          files = set(os.listdir(d))

          def sig_for(name):
              p = os.path.join(d, name + ".sig")
              return open(p).read().strip() if os.path.exists(p) else None

          def url_for(name):
              return (f"https://github.com/bixdot-app/bixdot/releases/download/"
                      f"{tag}/{name}")

          platforms = {}
          for f in sorted(files):
              s = sig_for(f)
              if not s:
                  continue
              if f.endswith("-setup.exe"):
                  platforms["windows-x86_64"] = {"signature": s, "url": url_for(f)}
              elif f == "BixDot_aarch64.app.tar.gz":
                  platforms["darwin-aarch64"] = {"signature": s, "url": url_for(f)}
              elif f == "BixDot_x64.app.tar.gz":
                  platforms["darwin-x86_64"] = {"signature": s, "url": url_for(f)}
              elif f.endswith(".AppImage"):
                  platforms["linux-x86_64"] = {"signature": s, "url": url_for(f)}

          if platforms:
              manifest = {
                  "version": version,
                  "notes": "See https://github.com/bixdot-app/bixdot/blob/main/CHANGELOG.md",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc)
                      .strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }
              with open(os.path.join(d, "latest.json"), "w") as fh:
                  json.dump(manifest, fh, indent=2)
              print("latest.json written for:", ", ".join(sorted(platforms)))
          else:
              print("No signed updater artifacts found — skipping latest.json "
                    "(add TAURI_SIGNING_PRIVATE_KEY to enable auto-updates).")
          EOF

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "installers/*"
          draft: true
          prerelease: false
          allowUpdates: true
          name: "BixDot ${{ github.ref_name }}"
          tag: ${{ github.ref_name }}
          body: |
            ## BixDot ${{ github.ref_name }} — Local AI Agent

            Your AI agent. Your device. Your data. No cloud required.

            ---

            ### Download

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows  | `BixDot_x64-setup.exe` | Recommended |
            | Windows  | `BixDot_x64_en-US.msi` | MSI alternative |
            | Mac (Apple Silicon) | `BixDot_aarch64.dmg` | M1/M2/M3 |
            | Mac (Intel) | `BixDot_x64.dmg` | Intel Macs |
            | Linux | `BixDot_amd64.AppImage` | Universal |
            | Linux | `BixDot_amd64.deb` | Debian/Ubuntu |

            ---

            ### Requirements

            **Windows / macOS:** nothing to pre-install — BixDot's first-run wizard downloads
            the official Ollama installer (signature-verified) and the AI model for you.

            **Linux:** install [Ollama](https://ollama.com) first; BixDot handles the rest.

            Python is bundled — no separate installation needed.

            ---

            ### What's new
            See [CHANGELOG.md](https://github.com/bixdot-app/bixdot/blob/main/CHANGELOG.md)

