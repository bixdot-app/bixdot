name: Feature Request
description: Suggest a skill, feature, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make BixDot better.
        Security issues? Email security@bixdot.app — not here.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that BixDot can't do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like?
      description: Describe the feature or skill you want
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - New skill
        - UI improvement
        - Performance
        - Privacy/security
        - Platform support (mobile, OS)
        - Other
    validations:
      required: true
