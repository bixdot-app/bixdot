name: Bug Report
description: Report a non-security bug
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerability?** Do NOT use this form.
        Email security@bixdot.app instead. See [SECURITY.md](../SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python -m core.main`
        2. Call POST /auth/login with...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: BixDot version
      placeholder: "v0.1.0 or git commit hash"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
